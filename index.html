<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Pro Pundit League — Premier League Prediction Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140d1f;
    --bg-2: #1b1329;
    --card: #211830;
    --card-2: #2a1f3d;
    --line: #362a4a;
    --line-bright: #4a3a63;
    --ink: #f3eefb;
    --ink-dim: #b9aecf;
    --ink-mute: #7d7196;
    --accent: #e90052;      /* PL magenta */
    --accent-2: #00ff87;    /* PL green */
    --cyan: #04f5ff;
    --purple: #963cff;
    --green: #00ff87;
    --red: #ff4d4d;
    --yellow: #ffd43b;
  }
  html.light {
    --bg:#f5f3fb; --bg-2:#ffffff; --card:#ffffff; --card-2:#f3eefb;
    --line:#e5e1ef; --line-bright:#d3cce1;
    --ink:#1b1430; --ink-dim:#4c4363; --ink-mute:#857aa0;
    --accent:#e90052; --accent-2:#06a35a; --green:#06a35a;
    --red:#d92d2d; --yellow:#b07d00; --purple:#7c3aed; --cyan:#0891b2;
  }
  html.light body {
    background-image:
      radial-gradient(1200px 600px at 90% -10%, rgba(233,0,82,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(6,179,104,0.05), transparent 60%),
      radial-gradient(700px 400px at 50% 50%, rgba(124,58,237,0.04), transparent 70%);
  }
  .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:999px; border:1px solid var(--line); background:var(--card-2); font-size:16px; line-height:1; transition:border 0.15s, background 0.15s; }
  .or-divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--ink-mute); font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; }
  .or-divider::before, .or-divider::after { content:''; height:1px; background:var(--line); flex:1; }
  .bottombar { position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 24px rgba(0,0,0,0.22); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bottombar-inner { display:flex; width:100%; max-width:600px; gap:2px; }
  .bb-btn { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 3px; color:var(--ink-mute); font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.03em; text-transform:uppercase; border-radius:8px; transition:color 0.15s, background 0.15s; }
  .bb-btn .bb-ic { font-size:19px; line-height:1; }
  .bb-btn .bb-lbl { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bb-btn:hover { color:var(--ink); }
  .bb-btn.active { color:var(--accent); background:rgba(233,0,82,0.10); }
  .team-chip.sv-disabled { opacity:0.4; cursor:not-allowed; }
  .pk-exact { background:rgba(0,255,135,0.18); }
  .pk-outcome { background:rgba(255,212,59,0.16); }
  .pk-wrong { background:rgba(233,0,82,0.14); }
  .pk-good { background:rgba(0,255,135,0.18); }
  .pk-bad { background:rgba(233,0,82,0.14); }
  .pk-legend { display:flex; gap:14px; flex-wrap:wrap; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-mute); margin-top:10px; }
  .pk-legend span { display:inline-flex; align-items:center; gap:5px; }
  .pk-dot { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .team-chip.sv-disabled:hover { border-color:var(--line); }
  .lb-compact th, .lb-compact td { padding:11px 12px; }
  .lb-move { font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; }
  .lb-move.up { color:var(--accent-2); }
  .lb-move.down { color:var(--red); }
  .lb-move.same { color:var(--ink-mute); }
  .lb-move.new { color:var(--purple); }
  .lb-move-cell { text-align:center; width:38px; }
  .lb-detail { background:var(--bg-2); }
  .lb-detail-sections { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim); margin-bottom:10px; }
  .lb-detail-sections strong { color:var(--ink); }
  .lb-week { width:100%; border-collapse:collapse; }
  .lb-week th { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.05em; color:var(--ink-mute); text-transform:uppercase; text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); }
  .lb-week th:first-child { text-align:left; }
  .lb-week td { font-family:'JetBrains Mono', monospace; font-size:12px; text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--ink-dim); }
  .lb-week td:first-child { text-align:left; color:var(--ink); font-weight:700; }
  .lb-week-tot { color:var(--accent) !important; font-weight:700; }
  .fdr-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .fdr-table { border-collapse:separate; border-spacing:0; width:auto; }
  .fdr-th, .fdr-th-team { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.06em; color:var(--ink-mute); text-transform:uppercase; font-weight:500; padding:10px 8px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--line); background:var(--card); }
  .fdr-th-date { font-size:9px; margin-top:2px; font-weight:400; opacity:0.85; }
  .fdr-th-team { position:sticky; left:0; z-index:3; text-align:left; cursor:pointer; min-width:132px; }
  .fdr-td-team { position:sticky; left:0; z-index:2; background:var(--card); padding:5px 10px; border-bottom:1px solid var(--line); min-width:132px; }
  .fdr-team-inner { display:flex; align-items:center; gap:8px; }
  .fdr-tn { font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fdr-nm-short { display:none; }
  .fdr-td { padding:4px 4px; border-bottom:1px solid var(--line); text-align:center; }
  .fdr-chip { min-width:66px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; padding:8px 6px; border-radius:6px; letter-spacing:0.01em; margin:2px auto; white-space:nowrap; }
  .fdr-blank { min-width:66px; text-align:center; color:var(--ink-mute); font-family:'JetBrains Mono', monospace; padding:8px 6px; }
  /* current gameweek column marker — a tinted column plus an accent cap on the
     header, so it reads as "now" without competing with the FDR chip colours */
  /* Vertical rails down both edges read far better than a background tint,
     which the FDR chips would otherwise cover up. */
  .fdr-th.fdr-now { background:rgba(233,0,82,0.16); color:var(--ink);
    box-shadow: inset 0 3px 0 var(--accent), inset 1px 0 0 var(--accent), inset -1px 0 0 var(--accent); }
  .fdr-td.fdr-now { background:rgba(233,0,82,0.07);
    box-shadow: inset 1px 0 0 rgba(233,0,82,0.5), inset -1px 0 0 rgba(233,0,82,0.5); }
  tr:last-child .fdr-td.fdr-now {
    box-shadow: inset 1px 0 0 rgba(233,0,82,0.5), inset -1px 0 0 rgba(233,0,82,0.5), inset 0 -3px 0 var(--accent); }
  .fdr-now-tag { display:block; margin-top:2px; font-size:8px; letter-spacing:0.16em; font-weight:700; color:var(--accent); }
  html.light .fdr-th.fdr-now { background:rgba(233,0,82,0.10); }
  html.light .fdr-td.fdr-now { background:rgba(233,0,82,0.045); }
  .fdr-key { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .fdr-key-lbl, .fdr-key-ends { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-mute); }
  .fdr-key-box { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; }
  .theme-toggle:hover { border-color:var(--accent); }
  .save-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; position:sticky; bottom:0; margin-top:16px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 -6px 20px rgba(0,0,0,0.18); z-index:5; }
  .save-status { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; }
  .fx-save { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .quick-nav { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .qn-btn { display:flex; align-items:center; gap:10px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--bg-2); color:var(--ink); font-weight:600; font-size:14px; text-align:left; transition:border 0.15s, transform 0.05s; }
  .qn-btn:hover { border-color:var(--accent); }
  .qn-btn:active { transform:scale(0.98); }
  .qn-emoji { font-size:20px; line-height:1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter Tight', sans-serif; min-height: 100vh; }
  body {
    background-image:
      radial-gradient(1200px 600px at 90% -10%, rgba(233,0,82,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(0,255,135,0.06), transparent 60%),
      radial-gradient(700px 400px at 50% 50%, rgba(150,60,255,0.05), transparent 70%);
    background-attachment: fixed;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; }
  a { color: var(--accent-2); }

  .app { max-width: 1280px; margin: 0 auto; padding: 0 24px calc(88px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 28px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-mark { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; font-size: 26px; line-height: 1; color: var(--ink); text-transform: uppercase; }
  .brand-mark .accent { color: var(--accent); }
  .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.15em; }
  .user-pill { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .user-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .user-pill button { font-size: 12px; color: var(--ink-mute); padding: 0 0 0 8px; border-left: 1px solid var(--line); }
  .user-pill button:hover { color: var(--accent); }

  .nav { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; overflow-x: auto; }
  .nav button { font-family: 'Anton', sans-serif; font-size: 17px; letter-spacing: 0.04em; padding: 14px 20px 16px; color: var(--ink-mute); border-bottom: 3px solid transparent; transition: all 0.15s; white-space: nowrap; text-transform: uppercase; }
  .nav button:hover { color: var(--ink); }
  .nav button.active { color: var(--ink); border-bottom-color: var(--accent); }

  .page-head { margin-bottom: 32px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px; }
  .page-title { font-family: 'Anton', sans-serif; font-size: clamp(38px, 7vw, 84px); line-height: 0.92; letter-spacing: -0.01em; text-transform: uppercase; }
  .page-title .it { font-family: 'Fraunces', serif; font-weight: 400; font-style: italic; font-size: 0.82em; letter-spacing: -0.02em; color: var(--accent); }
  .page-sub { color: var(--ink-dim); font-size: 16px; max-width: 760px; margin-top: 14px; line-height: 1.55; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
  .card-title { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .grid { display: grid; gap: 18px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.15s; border: 1px solid var(--line-bright); background: var(--card-2); color: var(--ink); }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #ff1a6b; border-color: #ff1a6b; }
  .btn-go { background: var(--accent-2); color: #04231a; border-color: var(--accent-2); }
  .btn-go:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border-color: var(--line); }
  .btn-danger { background: transparent; border-color: rgba(255,77,77,0.4); color: var(--red); }
  .btn-danger:hover { background: rgba(255,77,77,0.1); }
  .btn-sm { padding: 7px 12px; font-size: 11px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.15em; text-transform: uppercase; }
  .field input, .field select { background: var(--bg-2); border: 1px solid var(--line); color: var(--ink); padding: 11px 14px; font-size: 14px; border-radius: 3px; outline: none; transition: border 0.15s; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input:disabled, .field select:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .login-card { max-width: 480px; width: 100%; padding: 48px 40px; border: 1px solid var(--line); background: var(--card); position: relative; border-radius: 6px; }
  .login-card::before { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; height: 4px; background: linear-gradient(90deg, var(--accent), var(--purple), var(--accent-2)); border-radius: 6px 6px 0 0; }
  .login-title { font-family: 'Anton', sans-serif; font-size: 52px; line-height: 0.9; letter-spacing: 0; text-transform: uppercase; margin-bottom: 8px; }
  .login-title .it { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; color: var(--accent); }
  .login-sub { color: var(--ink-dim); margin-bottom: 32px; font-size: 14px; line-height: 1.5; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 32px; border-radius: 6px; overflow: hidden; }
  .stat { background: var(--card); padding: 22px 20px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-family: 'Anton', sans-serif; font-size: 42px; line-height: 1; letter-spacing: 0.02em; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-sub { font-size: 12px; color: var(--ink-dim); margin-top: 6px; }

  .rules-list { list-style: none; }
  .rules-list li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); gap: 16px; }
  .rules-list li:last-child { border-bottom: none; }
  .rule-name { font-size: 14px; color: var(--ink); }
  .rule-points { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 0.04em; }

  .fixture { background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .fixture-head { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .fixture-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .fx-team { font-size: 15px; font-weight: 600; }
  .fx-team.home { text-align: right; }
  .fx-score-in { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .fx-score-in input { width: 46px; text-align: center; font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 700; padding: 8px 4px; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 3px; outline: none; }
  .fx-score-in input:focus { border-color: var(--accent); }
  .fx-dash { color: var(--ink-mute); font-family: 'JetBrains Mono'; font-weight: 700; }
  .fx-result { margin-top: 10px; padding: 8px 12px; background: var(--card); border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); display: flex; justify-content: space-between; letter-spacing: 0.05em; }
  .fx-result .pts { color: var(--accent-2); font-weight: 700; }
  .gf-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: var(--yellow); border: 1px solid rgba(255,212,59,0.4); padding: 1px 6px; border-radius: 999px; margin-left: 8px; }

  .team-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .team-chip { padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-2); cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; min-width: 90px; text-align: center; }
  .team-chip:hover { border-color: var(--ink-dim); }
  .team-chip.selected { border-color: var(--accent); background: rgba(233,0,82,0.12); color: var(--accent); }
  .team-chip.used2 { opacity: 0.5; }
  .team-chip .uses { display: block; font-family: 'JetBrains Mono'; font-size: 9px; color: var(--ink-mute); letter-spacing: 0.1em; margin-top: 3px; }
  .tbadge { display:inline-block; vertical-align:middle; object-fit:contain; }
  .tbadge-fallback { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--bg-2); border:1px solid var(--line); color:var(--ink-dim); font-family:'JetBrains Mono'; font-weight:700; line-height:1; vertical-align:middle; }
  .chip-badge { display:block; margin:0 auto 6px; }
  .fixtures-list { display:flex; flex-direction:column; gap:10px; }
  .fxrow { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--bg-2); }
  .fxrow .side { display:flex; align-items:center; gap:10px; }
  .fxrow .side.home { justify-content:flex-end; }
  .fxrow .mid { text-align:center; font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-mute); min-width:74px; }
  .fxrow .mid .sc { font-size:18px; color:var(--ink); font-weight:700; letter-spacing:0.04em; }
  .fxrow .tn { font-weight:600; font-size:14px; }
  .fx-daygroup { margin-top:20px; }
  .fx-dayhdr { font-family:'JetBrains Mono'; font-size:11px; letter-spacing:0.14em; color:var(--ink-mute); text-transform:uppercase; margin:0 0 10px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:200; overflow:auto; }
  /* Never taller than the screen, and only the BODY scrolls — head and footer
     stay put. Stops the old nested-scrollbar mess (overlay + body + page). */
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; width:100%; max-width:680px; box-shadow:0 24px 60px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; max-height:calc(100vh - 48px); max-height:calc(100dvh - 48px); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .modal-head h3 { margin:0; font-family:'Anton'; font-size:22px; letter-spacing:0.02em; }
  .modal-body { padding:16px 20px; overflow:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto; min-height:0; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex:0 0 auto; }
  .pk-controls { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .pk-controls .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pk-input, .pk-select { width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--ink); padding:10px 12px; border-radius:6px; font-size:14px; }

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ============================================================
// SHARED STORE (Vercel /api/store -> Upstash Redis). Load-safe sync
// ported from the proven PANENKA build.
// ============================================================
const API_STORE = '/api/store';
const API_FPL = '/api/fpl';
const API_AUTH = '/api/auth';
const SYNC_POLL_MS = 30000;
let apiReady = false;

// Every call to /api/* must carry the HttpOnly session cookie that /api/auth
// sets after verifying a Google ID token. 'same-origin' is already the fetch
// default, but stating it makes the requirement obvious — without the cookie
// the server answers 401 and nothing can be read or written.
const CREDS = { credentials: 'same-origin' };
const JSON_POST = { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };

async function initApi() {
  try {
    const res = await fetch(`${API_STORE}?health=1`, CREDS);
    if (!res.ok) { apiReady = false; return false; }
    const data = await res.json();
    apiReady = !!data.ok;
    return apiReady;
  } catch (e) { console.warn('store offline', e); apiReady = false; return false; }
}
async function remoteGet(key) {
  if (!apiReady) return null;
  try { const r = await fetch(`${API_STORE}?key=${encodeURIComponent(key)}`, CREDS); if (!r.ok) return null; const d = await r.json(); return d.value ?? null; }
  catch (e) { console.warn('remoteGet', e); return null; }
}
// Distinguishes "server said empty" from "read failed" so we never stamp a
// blank state over live data under load.

  const p = parseScore(predStr);
  if (!p) return 0;
  const ph = p[0], pa = p[1], ah = fx.hScore, aa = fx.aScore;
  if (ah == null || aa == null) return 0;
  const exact = ph === ah && pa === aa;
  const outcomeHit = _sign(ph - pa) === _sign(ah - aa);
  let base = exact ? cfg.scoreExact : (outcomeHit ? cfg.scoreOutcome : 0);
  let bonus = 0;
  if ((ph + pa) > cfg.gfThreshold && (ah + aa) > cfg.gfThreshold) {
    if (exact) bonus = cfg.gfExact;
    else if (outcomeHit) bonus = cfg.gfOutcome;
  }

}

  if (usageCountBefore >= cfg.teamMaxUses) return -cfg.teamOverPenalty;
  const mine = (gwFixtures || []).filter(f => f.teamH === pick.team || f.teamA === pick.team);
  if (mine.length === 0) return 0;
  let target = mine;
  if (pick.oppTag) {
    const tagged = mine.filter(f => f.teamH === pick.oppTag || f.teamA === pick.oppTag);
    if (tagged.length) target = tagged;
  }
  const won = target.some(f => {
    if (!f.finished || f.hScore == null || f.aScore == null) return false;
    const homeWin = f.hScore > f.aScore, awayWin = f.aScore > f.hScore;
    return (f.teamH === pick.team && homeWin) || (f.teamA === pick.team && awayWin);
  });

}

  const sum = ids.reduce((t, id) => t + (Number((livePts || {})[id]) || 0), 0);

// F4 availability predicate for dropdowns (per-player usage limits).
function makeF4Availability(f4History) {
  return function isAvailable(playerId, pos, targetGW) {
    const uses = [];
    Object.entries(f4History || {}).forEach(([gwStr, pk]) => {
      const gw = parseInt(gwStr, 10);
      if (gw === targetGW || !pk) return;
      ["gk","def","mid","fwd"].forEach(slot => { if (pk[slot] === playerId) uses.push(gw); });
    });

// SEASON STANDINGS — aggregate every scored gameweek.

function computeStandings(users, state, fpl, maxGWOverride) {
  return (users || [])
    .map(u => computeUserSeason(u, state, fpl, maxGWOverride))
    .sort((a, b) => b.total - a.total);

// bottom-3 shorts by the table AS OF gw-1 (empty = no restriction, e.g. GW1 / preseason)
function survivorBottom3(allFixtures, teamsById, gw) {
  const teams = Object.values(teamsById || {});
  const table = buildLeagueTable(teams, allFixtures, gw - 1);
  if (!table.some(r => r.played > 0)) return [];
  return table.slice(-3).map(r => r.short);
}
// top-N shorts by the table AS OF gw-1. Same "no table yet => no restriction"
// behaviour as the bottom-3 rule, so GW1 (and preseason) is a free-for-all.
function survivorTopN(allFixtures, teamsById, gw, n) {
  const count = Number(n) || 0;
  if (count <= 0) return [];
  const teams = Object.values(teamsById || {});
  const table = buildLeagueTable(teams, allFixtures, gw - 1);
  if (!table.some(r => r.played > 0)) return [];
  return table.slice(0, count).map(r => r.short);
}
// Everything a pundit may NOT pick this gameweek:
//   short -> { why:'top'|'bottom', label }
// Note the two rules bite differently. The bottom-3 rule blocks the bottom
// clubs' OPPONENTS (backing someone to beat the worst side is too easy). The
// top-N rule blocks those clubs THEMSELVES — the point is to stop the same
// title-chasers being backed week after week.
function survivorBlocked(gwFixtures, bottom3, topN) {
  const blocked = {};
  (gwFixtures || []).forEach(f => {
    const hB = (bottom3 || []).includes(f.teamH), aB = (bottom3 || []).includes(f.teamA);
    if (hB && !aB) blocked[f.teamA] = { why: 'bottom', label: 'vs ' + f.teamH };
    if (aB && !hB) blocked[f.teamH] = { why: 'bottom', label: 'vs ' + f.teamA };
  });
  // Listed last so "you're top of the table" wins as the stated reason when a
  // club is caught by both rules at once.
  (topN || []).forEach((short, i) => { blocked[short] = { why: 'top', label: 'table #' + (i + 1) }; });
  return blocked;
}
// teams already used earlier this round: short -> gw
function survivorUsed(pred, startGW, gw) {
  const used = {};
  for (let g = startGW; g < gw; g++) { const t = pred && pred.survivor && pred.survivor[g]; if (t) used[t] = g; }
  return used;
}

// ---- Survivor / last-man-standing ----
function survivorTeamsUsed(survivorMap, exceptGW) {
  const used = [];
  Object.entries(survivorMap || {}).forEach(([gwStr, pk]) => {
    if (parseInt(gwStr, 10) === exceptGW) return;
    if (pk && pk.team) used.push(pk.team);
  });
  return used;
}
// Walks locked gameweeks in order. A draw/loss or a missed pick on a locked GW = out.
function computeSurvivor(pred, state, fpl, now) {
  const maxGW = state.activeGW || 1;
  let status = "alive", outGW = null;
  for (let gw = 1; gw <= maxGW; gw++) {
    if (!gwLocked(state, fpl, gw, now)) break;         // only locked GWs count (manual OR deadline passed)
    const pk = pred.survivor && pred.survivor[gw];
    if (!pk || !pk.team) { status = "out"; outGW = gw; break; }
    const fixtures = (fpl.fixturesByGW && fpl.fixturesByGW[gw]) || [];
    const mine = fixtures.filter(f => f.teamH === pk.team || f.teamA === pk.team);
    const fx = mine[0];
    if (!fx || !fx.finished || fx.hScore == null || fx.aScore == null) break;  // not resolved yet -> still alive
    const won = (fx.teamH === pk.team && fx.hScore > fx.aScore) || (fx.teamA === pk.team && fx.aScore > fx.hScore);
    if (!won) { status = "out"; outGW = gw; break; }
  }
  return { name: pred.name, status, outGW };
}
function computeSurvivorStandings(users, state, fpl, now) {
  return (users || []).filter(u => u.name)
    .map(u => computeSurvivor(u, state, fpl, now))
    .sort((a, b) => {
      if (a.status !== b.status) return a.status === "alive" ? -1 : 1;
      if (a.status === "out" && b.status === "out") return (b.outGW || 0) - (a.outGW || 0);
      return a.name.localeCompare(b.name);
    });
}

// MAIN APP

// ============================================================
// PORTAL — renders a modal at <body> level.
//
// Why this is needed: `.pitch-slot` sets `position:relative; z-index:2`, which
// makes each Fantastic Four slot its own STACKING CONTEXT. A modal rendered
// inside one of those slots has its z-index resolved *within* that slot, so the
// later slots (same z-index, further down the DOM) painted straight over the
// player picker. Raising the modal's z-index can't fix that — it has to escape
// the stacking context entirely, which is what a portal does.
//
// It also locks background scrolling while open, so the page behind stops
// moving under the modal.
// ============================================================
function Portal({ children }) {
  const [host] = useState(() => {
    const d = document.createElement('div');
    d.className = 'pp-portal';
    document.body.appendChild(d);
    return d;
  });
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.body.style.overflow = prev;
      try { document.body.removeChild(host); } catch {}
    };
  }, [host]);
  return ReactDOM.createPortal(children, host);
}

function BottomNav({ view, predictTab, goPredict, survivorEnabled }) {
  const items = [["scores","🎯","Scores"],["survivor","💀","Survivor"],["f4","⭐","F4"],["bonus","❓","Bonus"]];
  return (
    <nav className="bottombar" aria-label="Prediction sections">
      <div className="bottombar-inner">
        {items.map(([t, ic, lbl]) => (
          <button key={t} className={"bb-btn" + (view==="predict" && predictTab===t ? " active" : "")} onClick={()=>goPredict(t)}>
            <span className="bb-ic">{ic}</span><span className="bb-lbl">{lbl}</span>
          </button>
        ))}
      </div>
    </nav>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [state, setState] = useState(null);
  const [users, setUsers] = useState([]);
  const [fpl, setFpl] = useState({ boot: null, fixturesByGW: {}, liveByGW: {} });
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  // Admin flag comes from the server's whoami response and nowhere else.
  const [session, setSession] = useState({ ok:false, isAdmin:false });
  const isAdmin = !!session.isAdmin;
  const [remoteAvailable, setRemoteAvailable] = useState(false);
  const [fplBusy, setFplBusy] = useState(false);
  const [showAccount, setShowAccount] = useState(false);
  const [predictTab, setPredictTab] = useState("scores");
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("pp_theme") === "light" ? "light" : "dark"; } catch { return "dark"; } });
  useEffect(() => { try { document.documentElement.classList.toggle("light", theme === "light"); } catch {} try { localStorage.setItem("pp_theme", theme); } catch {} }, [theme]);
  const stateRef = useRef(null);
  useEffect(() => { stateRef.current = state; }, [state]);
  const survivorOnRef = useRef(null);   // survivor on/off source of truth (protected key), immune to stale clients
  const [staleBuild, setStaleBuild] = useState(false);

  const setSurvivorOn = useCallback(async (on) => {
    const val = !!on;
    survivorOnRef.current = val;
    setState(s => s ? { ...s, survivorEnabled: val } : s);
    try { localStorage.setItem("pp_survivor_on", JSON.stringify(val)); } catch {}
    if (apiReady) {
      let ok = false;
      for (let i = 0; i < 3 && !ok; i++) { if (i) await new Promise(r => setTimeout(r, 400)); ok = await remoteSet("pp_survivor_on", val); }
      if (!ok) showToast("⚠️ Couldn't save the survivor toggle — try again.");
    }
  }, [showToast]);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);
  const goPredict = useCallback((t) => { setPredictTab(t || "scores"); setView("predict"); }, []);
  const toggleTheme = useCallback(() => setTheme(t => t === "light" ? "dark" : "light"), []);

  // ---- load-safe shared state ----
  const refreshState = useCallback(async () => {
    let s = null;
    if (apiReady) {
      const res = await remoteGetStatus("pp_state");
      if (res.ok && res.value) { s = res.value; try { localStorage.setItem("pp_state", JSON.stringify(s)); } catch {} }
      else if (res.ok && !res.value) { s = defaultState(); await setShared("pp_state", s); }
      else { const local = parseStored(localStorage.getItem("pp_state")); if (local) { if (survivorOnRef.current != null) local.survivorEnabled = survivorOnRef.current; setState(local); } return local; }
    } else {
      s = parseStored(localStorage.getItem("pp_state")) || defaultState();
    }
    // non-destructive migrations
    let save = false;
    if (!s.scoring) { s.scoring = { ...DEFAULT_SCORING }; save = true; }
    if (!s.locks) { s.locks = {}; save = true; }
    if (!s.selectedFixtures) { s.selectedFixtures = {}; save = true; }
    if (!s.bonus) { s.bonus = {}; save = true; }
    if (s.survivorEnabled === undefined) { s.survivorEnabled = true; save = true; }
    if (!Array.isArray(s.survivorRounds)) { s.survivorRounds = []; save = true; }
    if (s.scoring && s.scoring.survivorWinBonus === undefined) { s.scoring.survivorWinBonus = 1; save = true; }
    if (s.survivorBlockTop === undefined) { s.survivorBlockTop = 3; save = true; }   // top-3 clubs off-limits in survivor
    if (!s.activeGW) { s.activeGW = 1; save = true; }
    if (!s.openGWs || !s.openGWs.length) { s.openGWs = [s.activeGW || 1]; save = true; }
    if (save && apiReady) await setShared("pp_state", s);
    // Survivor on/off lives in its own key so an out-of-date client can't flip it via pp_state.
    if (apiReady) {
      const so = await getShared("pp_survivor_on");
      if (so === null || so === undefined) { survivorOnRef.current = !!s.survivorEnabled; await setShared("pp_survivor_on", !!s.survivorEnabled); }
      else { s.survivorEnabled = !!so; survivorOnRef.current = !!so; }
    } else if (survivorOnRef.current != null) {
      s.survivorEnabled = survivorOnRef.current;
    }
    setState(s);
    return s;
  }, []);

  const loadUsers = useCallback(async () => {
    const keys = await listShared("pp_pred:");
    const all = [];
    for (const k of keys) { const d = await getShared(k); if (d) all.push(d); }
    setUsers(all);
    return all;
  }, []);

  // ---- FPL data for GW 1..activeGW (cached; only the live GW refetches) ----
  const loadFpl = useCallback(async (s, force) => {
    const st = s || stateRef.current;
    if (!st) return;
    setFplBusy(true);
    try {
      const boot = await fplBootstrap(force);
      const active = st.activeGW || 1;
      const open = (st.openGWs && st.openGWs.length) ? st.openGWs : [];
      const maxGW = Math.min(TOTAL_GW, Math.max(active, ...(open.length ? open : [active])));
      const fixturesByGW = {}, liveByGW = {};
      for (let gw = 1; gw <= maxGW; gw++) {
        const f = (force && gw === active);
        fixturesByGW[gw] = await fplFixtures(gw, f);
        liveByGW[gw] = await fplLive(gw, f);
      }
      setFpl({ boot, fixturesByGW, liveByGW });
    } catch (e) { console.warn('loadFpl', e); }
    finally { setFplBusy(false); }
  }, []);

  const refreshAll = useCallback(async (force) => {
    const s = await refreshState();
    await loadFpl(s, force);
    await loadUsers();
  }, [refreshState, loadFpl, loadUsers]);

  useEffect(() => {
    (async () => {
      const ready = await initApi();
      setRemoteAvailable(ready);
      // Ask the server who we are BEFORE trusting any locally-remembered name.
      // No valid session cookie => no session => back to the Google button,
      // no matter what localStorage claims.
      const who = await fetchSession();
      setSession(who);
      if (!who.ok) { try { localStorage.removeItem("current_user"); } catch {} setUser(null); setLoading(false); return; }
      if (await checkEpoch()) return;   // stale generation -> clears local + reloads
      const savedUser = await getPersonal("current_user");
      if (savedUser) setUser(savedUser);
      await refreshAll(false);
      setLoading(false);
    })();
  }, [refreshAll]);

  // Re-check the session periodically so a revoked/expired one drops the admin
  // deck and the signed-in state instead of lingering until a manual refresh.
  useEffect(() => {
    if (!remoteAvailable || !user) return;
    const id = setInterval(async () => {
      const who = await fetchSession();
      setSession(who);
      if (!who.ok) { setUser(null); try { localStorage.removeItem("current_user"); } catch {} }
    }, SYNC_POLL_MS * 4);
    return () => clearInterval(id);
  }, [remoteAvailable, user]);

  // poll shared state + live GW only (light). Requires a session — polling
  // while signed out would just be a stream of 401s.
  useEffect(() => {
    if (!remoteAvailable || !user) return;
    const id = setInterval(async () => {
      if (await checkEpoch()) return;
      const s = await refreshState();
      const active = (s || stateRef.current || {}).activeGW || 1;
      const fx = await fplFixtures(active, true);
      const lv = await fplLive(active, true);
      setFpl(prev => ({ ...prev, fixturesByGW: { ...prev.fixturesByGW, [active]: fx }, liveByGW: { ...prev.liveByGW, [active]: lv } }));
    }, SYNC_POLL_MS);
    return () => clearInterval(id);
  }, [remoteAvailable, refreshState, user]);

  // App-version beacon: advertise the newest build, and flush stale ones.
  // Publishing pp_ver is an admin-only write now, so the "newer version"
  // signal goes out when you (the admin) load a fresh deploy; everyone still
  // on an older build then gets the reload banner. Non-admin writes just
  // fail quietly, which is the intended behaviour.
  useEffect(() => {
    if (!remoteAvailable || !user) return;
    let stop = false;
    const check = async () => {
      try {
        const cur = Number(await getShared("pp_ver")) || 0;
        if (cur < APP_VERSION) { await setShared("pp_ver", APP_VERSION); }
        else if (cur > APP_VERSION && !stop) {
          setStaleBuild(true);
          try {
            const key = "pp_reloaded_" + cur;
            if (typeof document !== "undefined" && document.hidden && !sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, "1");
              const u = new URL(location.href); u.searchParams.set("v", String(cur)); location.replace(u.toString());
            }
          } catch {}
        }
      } catch {}
    };
    check();
    const id = setInterval(check, SYNC_POLL_MS);
    return () => { stop = true; clearInterval(id); };
  }, [remoteAvailable, user]);

  // Pull the freshest roster when opening a view that lists every pundit.
  useEffect(() => { if (remoteAvailable && user && (view === "leaderboard" || view === "admin")) { loadUsers(); } }, [view, remoteAvailable, user]);

  // If admin rights go away (session expired, email removed from ADMIN_EMAILS)
  // while the admin deck is open, leave it immediately.
  useEffect(() => { if (view === "admin" && !isAdmin) setView("home"); }, [view, isAdmin]);

  const login = useCallback(async (name) => {
    const clean = name.trim(); if (!clean) return;
    setUser(clean); await setPersonal("current_user", clean);
    // Pick up the freshly-issued session (and therefore admin status) right
    // away, so the Admin tab appears without needing a page reload.
    setSession(await fetchSession());
    await refreshAll(false);
  }, [refreshAll]);
  const logout = useCallback(async () => {
    await serverLogout();                 // kill the cookie, not just the local name
    setUser(null); setSession({ ok:false, isAdmin:false }); setView("home");
    await setPersonal("current_user", "");
  }, []);

  const myPred = useMemo(() => (!user || !users) ? null : users.find(u => u.name === user), [user, users]);

  const updateMyPred = useCallback(async (mutator) => {
    if (!user) return;
    let p = await getShared("pp_pred:" + user);
    if (!p) p = { name: user, joined: Date.now(), scores: {}, teamPick: {}, f4: {}, survivor: {}, bonusAnswers: {} };
    const updated = mutator({ ...p });
    updated.lastEdited = Date.now();
    await setShared("pp_pred:" + user, updated);
    setUsers(prev => prev.some(u => u.name === user) ? prev.map(u => u.name === user ? updated : u) : [...prev, updated]);
  }, [user]);

  // server-verified admin writes (never overwrite newer data / never blank)
  const updateState = useCallback(async (mutator) => {
    let base = null;
    if (apiReady) {
      base = await remoteGet("pp_state");
      if (!base) { showToast("⚠️ Couldn't reach the server — NOT saved. Try again."); return; }
    } else {
      base = parseStored(localStorage.getItem("pp_state"));
      if (!base) { showToast("⚠️ Offline and no local data — not saved."); return; }
    }
    const updated = mutator({ ...base });
    if (survivorOnRef.current != null) updated.survivorEnabled = survivorOnRef.current;   // protect admin-set survivor flag
    try { localStorage.setItem("pp_state", JSON.stringify(updated)); } catch {}
    setState(updated);
    if (!apiReady) { showToast("⚠️ Offline — saved on this device only."); return; }
    let ok = false;
    for (let i = 0; i < 3 && !ok; i++) { if (i) await new Promise(r => setTimeout(r, 500)); ok = await remoteSet("pp_state", updated); }
    if (!ok) { showToast("⚠️ NOT saved after retries — re-check and try again."); console.error("updateState failed"); }
  }, [showToast]);

  // ---- account + admin user management (write/delete pp_pred:<name> records) ----
  const changeDisplayName = useCallback(async (newName) => {
    const clean = (newName || "").trim();
    if (!clean) return { ok:false, msg:"Enter a display name" };
    if (clean.length > 30) return { ok:false, msg:"Keep the name under 30 characters" };
    if (!user) return { ok:false, msg:"Not signed in" };
    if (clean === user) return { ok:true };
    const exists = await getShared("pp_pred:" + clean);
    if (exists) return { ok:false, msg:"That name is taken — pick another" };
    const rec = await getShared("pp_pred:" + user);
    if (!rec) return { ok:false, msg:"Account not found — refresh and try again" };
    await setShared("pp_pred:" + clean, { ...rec, name: clean });
    if (rec.googleSub) await setShared("pp_google:" + rec.googleSub, { name: clean });
    const oldKey = "pp_pred:" + user;
    if (apiReady) await remoteDeleteKeys([oldKey]);
    try { localStorage.removeItem(oldKey); } catch {}
    setPersonal("current_user", clean);
    setUser(clean);
    await loadUsers();
    return { ok:true };
  }, [user, loadUsers]);

  // changeMyPassword() / adminSetPassword() removed — there are no passwords.

  // Creates a placeholder pundit with no Google link. The server only permits
  // this for an admin session — it is the one legitimate way an account can
  // exist without someone having signed in with Google, and it is exactly the
  // path that used to be wide open to everybody.
  const adminAddUser = useCallback(async (name) => {
    const clean = (name || "").trim();
    if (!clean) return { ok:false, msg:"Enter a name" };
    if (clean.length > 30) return { ok:false, msg:"Keep the name under 30 characters" };
    const existing = await getShared("pp_pred:" + clean);
    if (existing) return { ok:false, msg:"That name already exists" };
    const ok = await remoteSet("pp_pred:" + clean, { name: clean, joined: Date.now(), scores:{}, teamPick:{}, f4:{}, survivor:{}, bonusAnswers:{} });
    if (!ok) return { ok:false, msg:"Server refused — are you signed in as an admin?" };
    await loadUsers();
    return { ok:true };
  }, [loadUsers]);

  const adminDeleteUser = useCallback(async (name) => {
    const key = "pp_pred:" + name;
    if (apiReady) await remoteDeleteKeys([key]);
    try { localStorage.removeItem(key); } catch {}
    setUsers(prev => prev.filter(x => x.name !== name));
    await loadUsers();
    return { ok:true };
  }, [loadUsers]);

  const standings = useMemo(() => state ? computeStandings(users, state, fpl) : [], [users, state, fpl]);
  const survivorRounds = useMemo(() => state ? computeAllSurvivorRounds(state, users, fpl) : [], [state, users, fpl]);
  const survivorPts = useMemo(() => survivorPointsByName(survivorRounds, state && state.scoring && state.scoring.survivorWinBonus), [survivorRounds, state]);
  const survivorWins = useMemo(() => survivorWinsByName(survivorRounds), [survivorRounds]);

  if (loading) {
    return (
      <div className="login-wrap">
        <div style={{ fontFamily: 'Anton', fontSize: 32, letterSpacing: '0.04em', color: 'var(--ink-mute)' }}>LOADING…</div>
      </div>
    );
  }
  if (!user) return <LoginView onLogin={login} remoteAvailable={remoteAvailable} />;
  // League data is only fetched once a session exists, so between "signed in"
  // and "data arrived" there is a brief gap. Hold the loading screen instead of
  // rendering the app against a null state.
  if (!state) return (
    <div className="login-wrap">
      <div style={{ fontFamily: 'Anton', fontSize: 32, letterSpacing: '0.04em', color: 'var(--ink-mute)' }}>LOADING…</div>
    </div>
  );

  return (
    <>
      {staleBuild && (
        <div onClick={()=>{ try { const u=new URL(location.href); u.searchParams.set("v", String(Date.now())); location.href=u.toString(); } catch { location.reload(); } }}
          style={{ position:'fixed', top:0, left:0, right:0, zIndex:9999, background:'var(--accent)', color:'#fff', textAlign:'center', padding:'10px 14px', fontFamily:'JetBrains Mono, monospace', fontSize:12, fontWeight:700, letterSpacing:'0.06em', cursor:'pointer' }}>
          A newer version is available — tap to reload
        </div>
      )}
      <div className="app">
        <header className="top">
          <div className="brand">
            <div className="brand-mark">PRO <span className="accent">PUNDIT</span> LEAGUE</div>
            <div className="brand-sub">Season 6 · {state.season} · Premier League</div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <button className="theme-toggle" onClick={toggleTheme} title="Toggle day / night mode" aria-label="Toggle day or night mode">{theme==="light" ? "🌙" : "☀️"}</button>
            <div className="user-pill"><span className="dot"></span><span>{user}</span><button onClick={()=>setShowAccount(true)}>account</button><button onClick={logout}>switch</button></div>
          </div>
        </header>
        <nav className="nav">
          <button className={view==="home"?"active":""} onClick={()=>setView("home")}>Home</button>
          <button className={view==="predict"?"active":""} onClick={()=>setView("predict")}>Predict</button>
          <button className={view==="fixtures"?"active":""} onClick={()=>setView("fixtures")}>Fixtures</button>
          <button className={view==="picks"?"active":""} onClick={()=>setView("picks")}>Picks</button>
          <button className={view==="leaderboard"?"active":""} onClick={()=>setView("leaderboard")}>Leaderboard</button>
          <button className={view==="rules"?"active":""} onClick={()=>setView("rules")}>Rules</button>
          {/* The Admin tab only exists for a server-verified admin email. Even if

              admin-only write from a non-admin session with a 403. */}
          {isAdmin && <button className={view==="admin"?"active":""} onClick={()=>setView("admin")}>Admin</button>}
        </nav>

        {view==="home" && <HomeView state={state} user={user} myPred={myPred} standings={standings} fpl={fpl} fplBusy={fplBusy} onRefresh={()=>refreshAll(true)} setView={setView} goPredict={goPredict} survivorPts={survivorPts} />}
        {view==="predict" && <PredictView state={state} myPred={myPred} users={users} fpl={fpl} updateMyPred={updateMyPred} showToast={showToast} tab={predictTab} setTab={setPredictTab} survivorRounds={survivorRounds} />}
        {view==="fixtures" && <FixturesView state={state} fpl={fpl} />}
        {view==="picks" && <PicksView state={state} users={users} currentUser={user} fpl={fpl} />}

}

// Google-only: map a verified Google identity to a display name (create or claim).
async function googleClaimName(g, name) {
  const clean = (name || "").trim();
  if (!clean) return { ok:false, error:"Enter a display name" };
  if (clean.length > 30) return { ok:false, error:"Keep the name under 30 characters" };
  const existing = await getShared("pp_pred:" + clean);
  const write = async (rec) => { await setShared("pp_pred:" + clean, rec); await setShared("pp_google:" + g.sub, { name: clean }); return { ok:true, name: clean }; };
  if (!existing) return write({ name: clean, joined: Date.now(), googleSub: g.sub, email: g.email, scores:{}, teamPick:{}, f4:{}, survivor:{}, bonusAnswers:{} });
  if (existing.googleSub && existing.googleSub === g.sub) return write({ ...existing, email: g.email });
  if (existing.googleSub && existing.googleSub !== g.sub) return { ok:false, error:"That name is taken — pick another." };
  return write({ ...existing, googleSub: g.sub, email: g.email });   // claim a legacy (no-Google) name, keep picks
}

function GoogleButton({ onCredential, text }) {
  const ref = useRef(null);
  _gsiHandlerRef.current = onCredential;   // keep the active handler current
  useEffect(() => {
    if (!GOOGLE_CLIENT_ID) return;
    let tries = 0;
    const id = setInterval(() => {
      if (gsiReady()) {
        clearInterval(id);
        if (initGsi() && ref.current) {
          try {
            ref.current.innerHTML = "";
            const light = (typeof document !== 'undefined') && document.documentElement.classList.contains('light');
            window.google.accounts.id.renderButton(ref.current, { theme: light ? 'outline' : 'filled_blue', size: 'large', text: text || 'continue_with', shape: 'pill', logo_alignment: 'left', width: 260 });
          } catch (e) { console.warn('gsi render', e); }
        }
      } else if (++tries > 50) { clearInterval(id); }
    }, 100);
    return () => { clearInterval(id); if (_gsiHandlerRef.current === onCredential) _gsiHandlerRef.current = null; };
  }, []);
  if (!GOOGLE_CLIENT_ID) return null;
  return <div ref={ref} style={{ display:'flex', justifyContent:'center', minHeight:44 }} />;
}

function LoginView({ onLogin, remoteAvailable }) {
  const [step, setStep] = useState("google");   // google | name
  const [name, setName] = useState("");
  const [error, setError] = useState(""); const [busy, setBusy] = useState(false);
  const [googleAuth, setGoogleAuth] = useState(null);

  const handleGoogle = async (resp) => {
    if (!resp || !resp.credential) return;
    setBusy(true); setError("");
    const v = await verifyGoogleCredential(resp.credential);
    if (!v || !v.ok || !v.sub) { setBusy(false); setError("Google sign-in failed — please try again."); return; }
    const found = await googleFindAccount(v.sub);
    if (found.ok) { setBusy(false); onLogin(found.name); return; }
    setGoogleAuth({ sub: v.sub, email: v.email || "", gname: v.name || "" });
    setName((v.name || "").slice(0, 30)); setBusy(false); setStep("name");
  };
  const finishName = async () => {
    if (!googleAuth) { setStep("google"); setError("Google session expired — sign in again."); return; }
    setBusy(true); setError("");
    const r = await googleClaimName(googleAuth, name);
    setBusy(false);
    if (r.ok) onLogin(r.name); else setError(r.error || "Couldn't finish sign-in");
  };

  return (
    <div className="app">
      <div className="login-wrap">
        <div className="login-card">
          <div className="eyebrow">PREMIER LEAGUE · {new Date().getFullYear()} · SEASON 6</div>
          <div className="login-title">PRO <span className="it">pundit.</span></div>
          <p className="login-sub">
            {step === "google" && <>Welcome to the sixth season of Pro Pundit. Sign in with Google to make your picks — score predictions, team of the week, the Fantastic Four and bonus questions await.</>}
            {step === "name" && <>Signed in with Google{googleAuth && googleAuth.email ? <> as <strong style={{ color:'var(--accent)' }}>{googleAuth.email}</strong></> : ""}. Now pick the display name you'll show up as on the leaderboard — it can be anything, it doesn't have to match your Google name.</>}
          </p>
          {!remoteAvailable && (
            <div className="lock-banner" style={{ borderColor: 'rgba(255,77,77,0.3)', color: 'var(--red)' }}>⚠️ Shared storage is offline. Picks only save on this device until /api/store + Upstash Redis are linked in Vercel.</div>
          )}
          {!GOOGLE_CLIENT_ID && (
            <div className="lock-banner" style={{ borderColor: 'rgba(255,77,77,0.3)', color: 'var(--red)' }}>⚠️ Google sign-in isn't configured yet. Set GOOGLE_CLIENT_ID (and the Vercel env var) to enable login.</div>
          )}
          {step === "google" && (
            <div style={{ marginTop:8 }}>
              {error && <div style={{ color:'var(--red)', fontSize:13, marginBottom:12 }}>{error}</div>}
              {GOOGLE_CLIENT_ID ? <GoogleButton onCredential={handleGoogle} text="signin_with" /> : null}
              {busy && <p className="helper" style={{ marginTop:12 }}>Signing you in…</p>}
            </div>
          )}
          {step === "name" && (
            <>
              <div className="field">
                <label>Display name for the league</label>
                <input type="text" placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&finishName()} autoFocus disabled={busy} />
                <div className="helper">This is how you'll appear on the leaderboard. You can change it later from your account.</div>
              </div>
              {error && <div style={{ color:'var(--red)', fontSize:13, marginBottom:12 }}>{error}</div>}
              <button className="btn btn-primary" onClick={finishName} disabled={busy} style={{ width:'100%', justifyContent:'center', padding:'14px' }}>{busy?"Setting up…":"Enter the league →"}</button>
            </>
          )}
          <div className="login-footer">Pro Pundit League · <span className="accent">Season 6</span><div>© {new Date().getFullYear()} Pro Pundit League</div></div>
        </div>
      </div>
    </div>
  );
}

function teamsPlayingInGW(fixtures) {
  const set = [];
  (fixtures || []).forEach(f => { if (!set.includes(f.teamH)) set.push(f.teamH); if (!set.includes(f.teamA)) set.push(f.teamA); });
  return set.sort();
}
function opponentsInGW(fixtures, team) {
  const out = [];
  (fixtures || []).forEach(f => { if (f.teamH === team) out.push("vs " + f.teamA); else if (f.teamA === team) out.push("@ " + f.teamH); });
  return out;
}
function teamFixturesInGW(fixtures, team) {
  const out = [];
  (fixtures || []).forEach(f => {
    if (f.teamH === team) out.push({ opp: f.teamA, ha: "H" });
    else if (f.teamA === team) out.push({ opp: f.teamH, ha: "A" });
  });
  return out;
}
function teamRecentForm(fixturesByGW, team, uptoGW) {
  const res = [];
  Object.keys(fixturesByGW || {}).map(Number).filter(g => g <= uptoGW).forEach(g => {
    (fixturesByGW[g] || []).forEach(f => {
      if (!f.finished || f.hScore == null || f.aScore == null) return;
      if (f.teamH === team) res.push({ gw: g, opp: f.teamA, ha: "H", r: f.hScore > f.aScore ? "W" : f.hScore < f.aScore ? "L" : "D", k: f.kickoff });
      else if (f.teamA === team) res.push({ gw: g, opp: f.teamH, ha: "A", r: f.aScore > f.hScore ? "W" : f.aScore < f.hScore ? "L" : "D", k: f.kickoff });
    });
  });
  res.sort((a, b) => (a.gw - b.gw) || (new Date(a.k || 0) - new Date(b.k || 0)));
  return res.slice(-5);
}
function playerFixtureLabels(fixtures, teamsById, teamId) {
  const short = teamsById && teamsById[teamId] ? teamsById[teamId].short : null;
  if (!short) return [];
  return teamFixturesInGW(fixtures, short).map(x => x.opp + " (" + x.ha + ")");
}
function fmtTSB(v) { return (v == null || v === "") ? "—" : (String(v) + "%"); }
function fmtNum(v) { return (v == null || v === "") ? "—" : String(v); }
function statusInfo(pl) {
  if (!pl || pl.status === "a" || !pl.status) return { ok: true, label: "Available", color: "var(--accent-2)" };
  const map = { i: "Injured", s: "Suspended", d: "Doubtful", u: "Unavailable" };
  return { ok: false, label: map[pl.status] || "Flagged", color: "var(--red)" };
}
function teamCodeByShort(boot, short) {
  if (!boot || !boot.teams) return null;
  const t = Object.values(boot.teams).find(x => x.short === short);
  return (t && t.code != null) ? t.code : null;
}
function fplBadgeUrl(code) { return (code == null) ? null : ("https://resources.premierleague.com/premierleague/badges/70/t" + code + ".png"); }
// Club crest with a guaranteed text fallback — if the image can't load, shows the short code.
function TeamBadge({ short, code, boot, size, className }) {
  const s = size || 22;
  const c = (code != null) ? code : teamCodeByShort(boot, short);
  const [err, setErr] = useState(false);
  const url = fplBadgeUrl(c);
  if (!url || err) {
    return <span className={"tbadge-fallback " + (className || "")} style={{ width:s, height:s, fontSize: Math.max(8, Math.round(s * 0.32)) }}>{(short || "").slice(0,3)}</span>;
  }
  return <img className={"tbadge " + (className || "")} src={url} alt={short || ""} width={s} height={s} onError={()=>setErr(true)} />;
}

function fdrColor(d) {
  const map = {
    1: { bg:'#0b7a3b', fg:'#eafff2' },
    2: { bg:'#12d670', fg:'#06331c' },
    3: { bg:'#d9d9e0', fg:'#23232b' },
    4: { bg:'#ff2e6e', fg:'#ffffff' },
    5: { bg:'#7d0b31', fg:'#ffe9f0' },
  };
  return map[d] || { bg:'var(--bg-2)', fg:'var(--ink-mute)' };
}
// Build { byTeam: {short:{gw:[{opp,ha,diff}]}}, gwDate:{gw:ms} } from all season fixtures.
function buildFdrRows(teams, allFixtures) {
  const byTeam = {}; (teams || []).forEach(t => byTeam[t.short] = {});
  const gwDate = {};
  (allFixtures || []).forEach(f => {
    if (!f.gw) return;
    if (f.kickoff) { const t = new Date(f.kickoff).getTime(); if (!isNaN(t) && (!gwDate[f.gw] || t < gwDate[f.gw])) gwDate[f.gw] = t; }
    if (byTeam[f.teamH]) (byTeam[f.teamH][f.gw] = byTeam[f.teamH][f.gw] || []).push({ opp: f.teamA, ha: "H", diff: f.hDiff });
    if (byTeam[f.teamA]) (byTeam[f.teamA][f.gw] = byTeam[f.teamA][f.gw] || []).push({ opp: f.teamH, ha: "A", diff: f.aDiff });
  });
  return { byTeam, gwDate };
}

// Standard PL table computed from finished results. uptoGW=null -> whole season so far;
// pass a number to get the table "as of" that gameweek (used by survivor's bottom-3 rule).
function buildLeagueTable(teams, allFixtures, uptoGW) {
  const row = {};
  (teams || []).forEach(t => { row[t.short] = { short:t.short, name:t.name, code:t.code, id:t.id, played:0, win:0, draw:0, loss:0, gf:0, ga:0, gd:0, pts:0 }; });
  (allFixtures || []).forEach(f => {
    if (!f.finished || f.hScore == null || f.aScore == null) return;
    if (uptoGW != null && f.gw != null && f.gw > uptoGW) return;
    const H = row[f.teamH], A = row[f.teamA];
    if (!H || !A) return;
    H.played++; A.played++;
    H.gf += f.hScore; H.ga += f.aScore; A.gf += f.aScore; A.ga += f.hScore;
    if (f.hScore > f.aScore) { H.win++; H.pts += 3; A.loss++; }
    else if (f.hScore < f.aScore) { A.win++; A.pts += 3; H.loss++; }
    else { H.draw++; A.draw++; H.pts++; A.pts++; }
  });
  const rows = Object.values(row);
  rows.forEach(r => { r.gd = r.gf - r.ga; });
  rows.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
  rows.forEach((r,i) => { r.position = i+1; });
  return rows;
}

function PLTable({ state, fpl }) {
  const boot = fpl.boot;
  const [all, setAll] = useState(null);
  useEffect(() => { let alive=true; fplAllFixtures().then(fx => { if (alive) setAll(fx||[]); }).catch(()=>{ if(alive) setAll([]); }); return ()=>{alive=false;}; }, []);
  if (!boot || !boot.teams) return <div className="lock-banner" style={{ borderColor:'rgba(255,77,77,0.3)', color:'var(--red)' }}>⚠️ Couldn't load FPL data. The table works once deployed on Vercel; if you're live, hit Refresh on the Home tab.</div>;
  if (all === null) return <div className="empty-mini">Loading the table…</div>;
  const teams = Object.values(boot.teams);
  const rows = buildLeagueTable(teams, all);
  const anyPlayed = rows.some(r => r.played > 0);
  return (
    <div>
      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table className="pl-table">
            <thead><tr><th className="pl-pos">#</th><th className="pl-club">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th className="pl-hide">GF</th><th className="pl-hide">GA</th><th>GD</th><th className="pl-pts">Pts</th></tr></thead>
            <tbody>
              {rows.map(r => {
                const zone = r.position <= 4 ? "ucl" : r.position >= 18 ? "rel" : "";
                return (
                  <tr key={r.short} className={"pl-row " + zone}>
                    <td className="pl-pos">{r.position}</td>
                    <td className="pl-club"><TeamBadge short={r.short} code={r.code} boot={boot} size={22} /><span className="pl-nm"><span className="nm-full">{r.name}</span><span className="nm-short">{r.short}</span></span></td>
                    <td>{r.played}</td><td>{r.win}</td><td>{r.draw}</td><td>{r.loss}</td>
                    <td className="pl-hide">{r.gf}</td><td className="pl-hide">{r.ga}</td><td>{r.gd>0?"+":""}{r.gd}</td>
                    <td className="pl-pts">{r.pts}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {!anyPlayed && <p className="helper" style={{ marginTop:12 }}>No results yet — the table fills in as matches are played.</p>}
      <div className="pl-key" style={{ marginTop:12 }}>
        <span className="pl-key-item"><span className="pl-dot ucl"></span>Top 4</span>
        <span className="pl-key-item"><span className="pl-dot rel"></span>Bottom 3 — their opponents are blocked in Survivor</span>
      </div>
    </div>
  );
}

function FdrGrid({ state, fpl }) {
  const boot = fpl.boot;
  const [all, setAll] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const scrollRef = useRef(null);
  const nowRef = useRef(null);      // the current gameweek's <th>
  const didJump = useRef(false);
  useEffect(() => {
    let alive = true;
    fplAllFixtures().then(fx => { if (alive) setAll(fx || []); }).catch(() => { if (alive) setAll([]); });
    return () => { alive = false; };
  }, []);
  const scrollBy = (dx) => { if (scrollRef.current) scrollRef.current.scrollBy({ left: dx, behavior: 'smooth' }); };
  // The gameweek the league is actually on — same value the Fixtures and
  // Predict tabs call "current", so the whole app agrees on what "now" means.
  const curGW = (state && state.activeGW) || (boot && boot.currentGW) || null;
  const jumpToNow = (smooth) => {
    const wrap = scrollRef.current, th = nowRef.current;
    if (!wrap || !th) return;
    // Land the current week flush against the sticky team column — measured, not
    // guessed, so no half-clipped column peeks out from underneath it. Setting
    // scrollLeft directly (rather than scrollIntoView) keeps the page from
    // also jumping vertically.
    const teamCol = wrap.querySelector('.fdr-th-team');
    const left = Math.max(0, th.offsetLeft - (teamCol ? teamCol.offsetWidth : 132));
    if (smooth && wrap.scrollTo) wrap.scrollTo({ left, behavior: 'smooth' });
    else wrap.scrollLeft = left;
  };
  // Open the grid already showing the current week instead of back at GW1.
  useEffect(() => {
    if (didJump.current || all === null || !curGW) return;
    didJump.current = true;
    requestAnimationFrame(() => jumpToNow(false));
  }, [all, curGW]);

  if (!boot || !boot.teams) return <div className="lock-banner" style={{ borderColor:'rgba(255,77,77,0.3)', color:'var(--red)' }}>⚠️ Couldn't load FPL data. The FDR grid works once deployed on Vercel; if you're live, hit Refresh on the Home tab.</div>;
  if (all === null) return <div className="empty-mini">Loading fixture difficulty…</div>;
  if (all.length === 0) return <div className="empty"><div className="empty-title">NO FIXTURES YET</div><p>Fixture difficulty appears once the FPL schedule is published.</p></div>;

  const teams = Object.values(boot.teams).slice().sort((a,b) => sortDir==="asc" ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  const gws = Array.from({ length: TOTAL_GW }, (_,i) => i+1);
  const { byTeam, gwDate } = buildFdrRows(teams, all);

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, flexWrap:'wrap', marginBottom:14 }}>
        <div className="fdr-key">
          <span className="fdr-key-lbl">FDR</span>
          {[1,2,3,4,5].map(d => { const c = fdrColor(d); return <span key={d} className="fdr-key-box" style={{ background:c.bg, color:c.fg }}>{d}</span>; })}
          <span className="fdr-key-ends">easy → hard</span>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn btn-sm btn-ghost" onClick={()=>scrollBy(-340)}>‹ Prev</button>
          {curGW && <button className="btn btn-sm" onClick={()=>jumpToNow(true)} title={"Jump to gameweek " + curGW}>◎ GW{curGW}</button>}
          <button className="btn btn-sm btn-ghost" onClick={()=>scrollBy(340)}>Next ›</button>
        </div>
      </div>
      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div className="fdr-wrap" ref={scrollRef}>
          <table className="fdr-table">
            <thead>
              <tr>
                <th className="fdr-th-team" onClick={()=>setSortDir(d=>d==="asc"?"desc":"asc")} title="Sort by team name">Team {sortDir==="asc"?"▲":"▼"}</th>
                {gws.map(g => {
                  const isNow = g === curGW;
                  return (
                    <th key={g} className={"fdr-th" + (isNow ? " fdr-now" : "")} ref={isNow ? nowRef : null} title={isNow ? "Current gameweek" : undefined}>
                      GW{g}
                      <div className="fdr-th-date">{gwDate[g] ? new Date(gwDate[g]).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : ""}</div>
                      {isNow && <span className="fdr-now-tag">NOW</span>}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {teams.map(t => (
                <tr key={t.id}>
                  <td className="fdr-td-team"><div className="fdr-team-inner"><TeamBadge short={t.short} code={t.code} boot={boot} size={22} /><span className="fdr-tn"><span className="fdr-nm-full">{t.name}</span><span className="fdr-nm-short">{t.short}</span></span></div></td>
                  {gws.map(g => {
                    const arr = (byTeam[t.short] && byTeam[t.short][g]) || [];
                    return (
                      <td key={g} className={"fdr-td" + (g === curGW ? " fdr-now" : "")}>
                        {arr.length === 0
                          ? <div className="fdr-blank">—</div>
                          : arr.map((x,i) => { const c = fdrColor(x.diff); return <div key={i} className="fdr-chip" style={{ background:c.bg, color:c.fg }}>{x.opp} ({x.ha})</div>; })}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <p className="helper" style={{ marginTop:12 }}>Colour = FPL fixture difficulty from that club's perspective (1 easiest, 5 hardest). {curGW ? <>The <strong style={{ color:'var(--accent)' }}>highlighted GW{curGW}</strong> column is the current gameweek — the grid opens there, and "◎ GW{curGW}" jumps back to it. </> : null}Swipe sideways or use Prev / Next to see more weeks. Tap "Team" to flip the order. Handy for planning team of the week, survivor and the Fantastic Four.</p>
    </div>
  );
}

function FixturesByWeek({ state, fpl }) {
  const boot = fpl.boot;
  const [selGW, setSelGW] = useState(state.activeGW || 1);
  const [extra, setExtra] = useState({});
  useEffect(() => {
    let alive = true;
    const have = (fpl.fixturesByGW && fpl.fixturesByGW[selGW]) || extra[selGW];
    if (!have) { fplFixtures(selGW).then(fx => { if (alive) setExtra(e => ({ ...e, [selGW]: fx || [] })); }).catch(()=>{}); }
    return () => { alive = false; };
  }, [selGW]);
  const codeOf = (id, short) => (boot && boot.teams && boot.teams[id] && boot.teams[id].code != null) ? boot.teams[id].code : teamCodeByShort(boot, short);
  const raw = (fpl.fixturesByGW && fpl.fixturesByGW[selGW]) || extra[selGW] || [];
  const fixtures = raw.slice().sort((a,b) => {
    const ka = a.kickoff ? new Date(a.kickoff).getTime() : 8.64e15;
    const kb = b.kickoff ? new Date(b.kickoff).getTime() : 8.64e15;
    return ka - kb;
  });
  const groups = {};
  fixtures.forEach(f => {
    const key = f.kickoff ? new Date(f.kickoff).toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' }) : "Date TBC";
    (groups[key] = groups[key] || []).push(f);
  });
  return (
    <div>
      <div className="card" style={{ marginBottom:20, display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:12, letterSpacing:'0.1em', color:'var(--ink-mute)' }}>GAMEWEEK {selGW}</span>
        <button className="btn btn-sm" onClick={()=>setSelGW(g => Math.max(1, g-1))}>−</button>
        <select value={selGW} onChange={e=>setSelGW(parseInt(e.target.value,10))} style={{ background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'8px 12px', borderRadius:4, fontWeight:600 }}>
          {Array.from({length: TOTAL_GW}, (_,i)=>i+1).map(g => <option key={g} value={g}>Gameweek {g}{g===(state.activeGW||1) ? " · current" : ""}</option>)}
        </select>
        <button className="btn btn-sm" onClick={()=>setSelGW(g => Math.min(TOTAL_GW, g+1))}>+</button>
      </div>
      {!boot && <div className="lock-banner" style={{ borderColor:'rgba(255,77,77,0.3)', color:'var(--red)' }}>⚠️ Couldn't load FPL fixtures. They load once deployed on Vercel; if you're live, hit Refresh on the Home tab.</div>}
      {fixtures.length === 0 ? (
        <div className="empty"><div className="empty-title">NO FIXTURES YET</div><p>FPL fixtures for GW{selGW} aren't available yet. They usually appear once the schedule is confirmed.</p></div>
      ) : Object.entries(groups).map(([day, fx]) => (
        <div key={day} className="fx-daygroup">
          <p className="fx-dayhdr">{day}</p>
          <div className="fixtures-list">
            {fx.map(f => {
              const time = f.kickoff ? new Date(f.kickoff).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }) : "TBC";
              return (
                <div key={f.id} className="fxrow">
                  <div className="side home"><span className="tn">{f.teamH}</span><TeamBadge short={f.teamH} code={codeOf(f.teamHId, f.teamH)} boot={boot} size={30} /></div>
                  <div className="mid">{f.finished ? <span className="sc">{f.hScore}–{f.aScore}</span> : <span>{time}</span>}<div style={{ marginTop:3, fontSize:10, letterSpacing:'0.1em' }}>{f.finished ? "FT" : ""}</div></div>
                  <div className="side away"><TeamBadge short={f.teamA} code={codeOf(f.teamAId, f.teamA)} boot={boot} size={30} /><span className="tn">{f.teamA}</span></div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <p className="helper" style={{ marginTop:16 }}>Kickoff times shown in your local timezone. Scores fill in automatically as matches finish.</p>
    </div>
  );
}

function playersByTeamPos(players) {
  const out = {};
  Object.values(players || {}).forEach(p => {
    if (!out[p.teamId]) out[p.teamId] = { GK: [], DEF: [], MID: [], FWD: [] };
    if (out[p.teamId][p.pos]) out[p.teamId][p.pos].push(p);
  });
  Object.values(out).forEach(t => POSITIONS.forEach(pos => t[pos].sort((a,b)=>a.name.localeCompare(b.name))));
  return out;
}
