      {tab==="scores" && <ScoresTab state={state} gw={gw} locked={locked} fixtures={fixtures} boot={boot} myPred={myPred} updateMyPred={updateMyPred} showToast={showToast} scoreDraft={scoreDraft} setScoreDraft={setScoreDraft} />}
      {tab==="f4" && <F4Tab state={state} gw={gw} locked={locked} live={live} boot={boot} fixtures={fixtures} myPred={myPred} updateMyPred={updateMyPred} showToast={showToast} />}
      {tab==="survivor" && <SurvivorTab state={state} myPred={myPred} fpl={fpl} survivorRounds={survivorRounds} updateMyPred={updateMyPred} showToast={showToast} />}
      {tab==="bonus" && <BonusTab state={state} gw={gw} locked={locked} myPred={myPred} fpl={fpl} updateMyPred={updateMyPred} showToast={showToast} />}
    </div>
  );
}

function ScoresTab({ state, gw, locked, fixtures, boot, myPred, updateMyPred, showToast }) {
  const sc = state.scoring || DEFAULT_SCORING;
  const selIds = (state.selectedFixtures && state.selectedFixtures[gw]) || [];
  const selected = selIds.map(id => fixtures.find(f => String(f.id) === String(id))).filter(Boolean);
  const preds = (myPred.scores && myPred.scores[gw]) || {};
  const fullName = (short, id) => (boot && boot.teams && boot.teams[id]) ? boot.teams[id].name : short;

  // Auto-save on every keystroke (PANENKA-style — no save button).
  const setHalf = (fid, which, val) => {
    if (locked) { showToast("Gameweek locked"); return; }
    const v = val.replace(/[^0-9]/g, "").slice(0,2);
    const cur = (preds[fid] || "").split("-");
    const next = which === 0 ? `${v}-${cur[1]||""}` : `${cur[0]||""}-${v}`;
    updateMyPred(p => ({ ...p, scores: { ...p.scores, [gw]: { ...(p.scores && p.scores[gw]), [fid]: next } } }));
  };
  const clearAll = () => { if (locked) { showToast("Gameweek locked"); return; } updateMyPred(p => ({ ...p, scores: { ...p.scores, [gw]: {} } })); showToast("All scores cleared"); };
  const hasAny = selected.some(f => (preds[f.id] || "").replace("-","").trim() !== "");

  if (selected.length === 0) {
    return <div className="empty"><div className="empty-title">FIXTURES NOT SET</div><p>The admin hasn't selected this gameweek's score-prediction fixtures yet. Check back once they do.</p></div>;
  }
  return (
    <div>
      {locked && <div className="lock-banner">🔒 Score predictions for GW{gw} are locked.</div>}
      <p className="helper" style={{ marginBottom:16 }}>Predict the exact scoreline — it saves automatically as you type. Outcome = {sc.scoreOutcome} pt · exact = {sc.scoreExact} pts. Predict a total above {sc.gfThreshold} for a shot at the Goal Fest Bonus.</p>
      {selected.map(f => {
        const val = preds[f.id] || "";
        const parts = val.split("-");
        const p = parseScore(val);
        const gfEligible = p && (p[0]+p[1]) > sc.gfThreshold;
        const pts = locked ? scoreFixturePoints(val, f, sc) : null;
        return (
          <div key={f.id} className="fixture">
            <div className="fixture-head">
              <span>{f.kickoff ? new Date(f.kickoff).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ("GW"+gw)}</span>
              <span>{gfEligible ? <span className="gf-tag">⚡ GOAL FEST</span> : ""}</span>
            </div>
            <div className="fixture-body">
              <div className="fx-team home" style={{ display:'flex', alignItems:'center', gap:8, justifyContent:'flex-end' }}><span className="fx-nm"><span className="nm-full">{fullName(f.teamH, f.teamHId)}</span><span className="nm-short">{f.teamH}</span></span><TeamBadge short={f.teamH} code={boot&&boot.teams&&boot.teams[f.teamHId]?boot.teams[f.teamHId].code:null} boot={boot} size={22} /></div>
              <div className="fx-score-in">
                <input type="number" min="0" max="20" value={parts[0]||""} disabled={locked} onChange={e=>setHalf(f.id,0,e.target.value)} />
                <span className="fx-dash">–</span>
                <input type="number" min="0" max="20" value={parts[1]||""} disabled={locked} onChange={e=>setHalf(f.id,1,e.target.value)} />
              </div>
              <div className="fx-team" style={{ display:'flex', alignItems:'center', gap:8, justifyContent:'flex-start' }}><TeamBadge short={f.teamA} code={boot&&boot.teams&&boot.teams[f.teamAId]?boot.teams[f.teamAId].code:null} boot={boot} size={22} /><span className="fx-nm"><span className="nm-full">{fullName(f.teamA, f.teamAId)}</span><span className="nm-short">{f.teamA}</span></span></div>
            </div>
            {f.finished && (
              <div className="fx-result">
                <span>FT · {f.teamH} {f.hScore}–{f.aScore} {f.teamA}</span>
                {locked ? <span className="pts">+{pts} pts</span> : <span>picks locked to score</span>}
              </div>
            )}
          </div>
        );
      })}
      {!locked && hasAny && (
        <div style={{ marginTop:8 }}>
          <button className="btn btn-ghost btn-sm" onClick={clearAll}>✕ Clear all scores</button>
        </div>
      )}
    </div>
  );
}

function TeamTab({ state, gw, locked, fixtures, boot, fpl, myPred, updateMyPred, showToast }) {
  const sc = state.scoring || DEFAULT_SCORING;
  const teams = teamsPlayingInGW(fixtures);
  const pick = (myPred.teamPick && myPred.teamPick[gw]) || null;
  const nextFix = pick && pick.team ? teamFixturesInGW(fixtures, pick.team) : [];
  const form = pick && pick.team ? teamRecentForm((fpl && fpl.fixturesByGW) || {}, pick.team, gw) : [];
  const fullName = (short) => { const t = boot && boot.teams && Object.values(boot.teams).find(x=>x.short===short); return t ? t.name : short; };
  // teams appearing in >1 fixture this GW => double gameweek team (need opponent tag)
  const dgwOpps = {};
  teams.forEach(t => {
    const opps = [];
    fixtures.forEach(f => { if (f.teamH===t) opps.push(f.teamA); else if (f.teamA===t) opps.push(f.teamH); });
    if (opps.length > 1) dgwOpps[t] = opps;
  });

  const choose = (team) => {
    if (locked) { showToast("Gameweek locked"); return; }
    const usesElsewhere = teamUsesTotal(myPred.teamPick, team) - ((pick && pick.team===team)?1:0);
    if (usesElsewhere >= sc.teamMaxUses) showToast(`Heads up: you've already used ${team} ${usesElsewhere}× — this pick would score -${sc.teamOverPenalty}`);
    const oppTag = dgwOpps[team] ? (pick && pick.team===team ? pick.oppTag : "") : "";
    updateMyPred(p => ({ ...p, teamPick: { ...p.teamPick, [gw]: { team, oppTag } } }));
  };
  const setOpp = (opp) => {
    if (locked || !pick) return;
    updateMyPred(p => ({ ...p, teamPick: { ...p.teamPick, [gw]: { ...pick, oppTag: opp } } }));
  };
  const clear = () => { if (locked) { showToast("Gameweek locked"); return; } updateMyPred(p => ({ ...p, teamPick: { ...p.teamPick, [gw]: undefined } })); };

  let resultLine = null;
  if (locked && pick && pick.team) {
    const before = teamUsesBefore(myPred.teamPick, pick.team, gw);
    const pts = teamPickPoints(pick, fixtures, before, sc);
    resultLine = <div className="fx-result" style={{ marginTop:16 }}><span>Your pick: {pick.team}{pick.oppTag?` (${pick.oppTag})`:""}</span><span className="pts">{pts>=0?"+":""}{pts} pts</span></div>;
  }

  if (teams.length === 0) return <div className="empty"><div className="empty-title">NO FIXTURES</div><p>FPL fixtures for GW{gw} aren't available yet.</p></div>;
  return (
    <div>
      {locked && <div className="lock-banner">🔒 Team of the week for GW{gw} is locked.</div>}
      <p className="helper" style={{ marginBottom:16 }}>Pick ONE team you're backing to win (a draw scores nothing). Win = {sc.teamWin} pts. You can use each team {sc.teamMaxUses}× all season; a 3rd use scores -{sc.teamOverPenalty}.</p>
      <div className="team-grid">
        {teams.map(t => {
          const total = teamUsesTotal(myPred.teamPick, t) - ((pick && pick.team===t)?1:0);
          const sel = pick && pick.team === t;
          return (
            <div key={t} className={"team-chip" + (sel?" selected":"")} onClick={()=>choose(t)} style={{ cursor: locked?'not-allowed':'pointer' }} title={fullName(t)}>
              <TeamBadge short={t} boot={boot} size={26} className="chip-badge" />
              {t}
              <span className="uses">{opponentsInGW(fixtures, t).join(" · ")}</span>
              <span className="uses">{total===0?"unused":`used ${total}×`}{dgwOpps[t]?" · DGW":""}</span>
            </div>
          );
        })}
      </div>
      {pick && pick.team && !locked && (
        <div style={{ marginTop:14 }}>
          <button className="btn btn-ghost btn-sm" onClick={clear}>✕ Clear team pick</button>
        </div>
      )}
      {pick && pick.team && (
        <div className="card" style={{ marginTop:18 }}>
          <div style={{ display:'flex', alignItems:'center', gap:14, flexWrap:'wrap' }}>
            <TeamBadge short={pick.team} boot={boot} size={44} />
            <div style={{ flex:1, minWidth:150 }}>
              <div style={{ fontFamily:'Anton', fontSize:22 }}>{fullName(pick.team)}</div>
              <div className="helper" style={{ margin:0 }}>Backed to win GW{gw}</div>
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontFamily:'JetBrains Mono', fontSize:10, letterSpacing:'0.12em', color:'var(--ink-mute)' }}>NEXT FIXTURE</div>
              <div style={{ fontWeight:700, fontSize:15 }}>{nextFix.length ? nextFix.map(x=>x.opp+" ("+(x.ha==='H'?'Home':'Away')+")").join(", ") : "—"}</div>
            </div>
            <div style={{ textAlign:'right', minWidth:110 }}>
              <div style={{ fontFamily:'JetBrains Mono', fontSize:10, letterSpacing:'0.12em', color:'var(--ink-mute)' }}>RECENT FORM</div>
              <div style={{ display:'flex', gap:4, justifyContent:'flex-end', marginTop:4 }}>
                {form.length ? form.map((r,i)=>(<span key={i} title={"GW"+r.gw+" "+(r.ha==='H'?'vs':'@')+" "+r.opp} style={{ display:'inline-flex', width:20, height:20, alignItems:'center', justifyContent:'center', borderRadius:4, fontFamily:'JetBrains Mono', fontSize:11, fontWeight:700, color:'#0b0b12', background: r.r==='W'?'var(--accent-2)':r.r==='D'?'#c9a227':'var(--red)' }}>{r.r}</span>)) : <span style={{ color:'var(--ink-mute)' }}>N/A</span>}
              </div>
            </div>
          </div>
        </div>
      )}
      {pick && dgwOpps[pick.team] && !locked && (
        <div className="card" style={{ marginTop:18 }}>
          <div className="card-title" style={{ fontSize:16 }}>Double gameweek — which {pick.team} fixture?</div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            {dgwOpps[pick.team].map(opp => (
              <div key={opp} className={"team-chip" + (pick.oppTag===opp?" selected":"")} onClick={()=>setOpp(opp)}>vs {opp}</div>
            ))}
          </div>
          <p className="helper" style={{ marginTop:10 }}>Pick the specific fixture you mean, e.g. {pick.team} ({dgwOpps[pick.team][0]}).</p>
        </div>
      )}
      {resultLine}
    </div>
  );
}

function F4Tab({ state, gw, locked, live, boot, fixtures, myPred, updateMyPred, showToast }) {
  const sc = state.scoring || DEFAULT_SCORING;
  if (!boot || !boot.players) return <div className="empty"><div className="empty-title">PLAYERS LOADING</div><p>FPL player data isn't available yet.</p></div>;
  const players = boot.players;
  const teams = boot.teams;
  const byTeamPos = useMemo(() => playersByTeamPos(players), [players]);
  const isAvailable = useMemo(() => makeF4Availability(myPred.f4), [myPred.f4]);
  const f4 = (myPred.f4 && myPred.f4[gw]) || {};
  const slotKey = { GK:"gk", DEF:"def", MID:"mid", FWD:"fwd" };
  const setPlayer = (pos, playerId) => {
    if (locked) { showToast("Gameweek locked"); return; }
    updateMyPred(p => ({ ...p, f4: { ...p.f4, [gw]: { ...(p.f4 && p.f4[gw]), [slotKey[pos]]: playerId || undefined } } }));
  };
  const teamList = Object.values(teams || {}).sort((a,b)=>a.name.localeCompare(b.name));
  const sum = f4Points(f4, live, sc);
  const hasAny = POSITIONS.some(pos => f4[slotKey[pos]]);
  const clearAll = () => { if (locked) { showToast("Gameweek locked"); return; } updateMyPred(p => ({ ...p, f4: { ...p.f4, [gw]: {} } })); };
  const pitchOrder = ["GK","DEF","MID","FWD"];
  return (
    <div>
      {locked && <div className="lock-banner">🔒 Fantastic Four for GW{gw} is locked.</div>}
      <p className="helper" style={{ marginBottom:16 }}>Tap a spot on the pitch to pick that position — you score the sum of your four players' real FPL points. DEF/MID: once all season. GK/FWD: twice, once per half.</p>
      <div className="pitch">
        <div className="pitch-box top"></div>
        <div className="pitch-box bottom"></div>
        {pitchOrder.map(pos => {
          const currentId = f4[slotKey[pos]];
          const current = currentId ? players[currentId] : null;
          return (
            <F4Slot key={pos} pos={pos} gw={gw} locked={locked} current={current}
              players={players} teams={teamList} teamsById={teams} byTeamPos={byTeamPos}
              isAvailable={isAvailable} live={live} fixtures={fixtures} boot={boot}
              onPick={(pid)=>setPlayer(pos, pid)} onClear={()=>setPlayer(pos, undefined)} showToast={showToast} />
          );
        })}
      </div>
      <div className="card" style={{ marginTop:16, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div className="card-title" style={{ margin:0, fontSize:18 }}>Fantastic Four total (GW{gw})</div>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          {!locked && hasAny && <button className="btn btn-ghost btn-sm" onClick={clearAll}>✕ Clear all</button>}
          <div style={{ fontFamily:'Anton', fontSize:32, color:'var(--accent-2)' }}>{sum}</div>
        </div>
      </div>
    </div>
  );
}

function F4Slot({ pos, gw, locked, current, players, teams, teamsById, byTeamPos, isAvailable, live, fixtures, boot, onPick, onClear, showToast }) {
  const [open, setOpen] = useState(false);
  const pts = current ? (Number(live[current.id]) || 0) : null;

  return (
    <div className="pitch-slot">
      <button className={"pitch-node" + (current?" filled":"")} disabled={locked} onClick={()=>setOpen(true)} title={current?("Swap "+current.name):("Pick "+POS_LABEL[pos])}>
        {current ? <TeamBadge short={current.teamShort} boot={boot} size={42} /> : <span className="pitch-plus">+</span>}
        {showPts ? <span className="pitch-pts">{pts}</span> : null}
      </button>
      <div className="pitch-tag">{current ? current.name : pos}</div>
      {current ? (
        <div className="pitch-meta">{current.teamShort}{fixLabels.length ? " · " + fixLabels.join(", ") : ""}{!st.ok ? <span style={{ color:'#ffbdbd' }}> · {st.label}</span> : ""}</div>

        <div className="pitch-meta muted">{POS_LABEL[pos]}</div>

      )}

  );
}

function F4PickerModal({ pos, gw, current, players, teams, teamsById, isAvailable, fixtures, boot, onClose, onPick }) {
  const [q, setQ] = useState("");
  const [club, setClub] = useState("");
  const [sort, setSort] = useState("pts");
  const [compareId, setCompareId] = useState(null);
  const num = v => { const n = parseFloat(v); return isNaN(n) ? -1 : n; };
  const candidates = useMemo(() => {
    let list = Object.values(players).filter(pl => pl.pos === pos && (isAvailable(pl.id, pos, gw) || (current && current.id === pl.id)));
    if (club) list = list.filter(pl => String(pl.teamId) === String(club));
    if (q.trim()) { const t = q.trim().toLowerCase(); list = list.filter(pl => (pl.name||"").toLowerCase().includes(t) || (pl.full||"").toLowerCase().includes(t)); }
    return list.slice().sort((a,b) => {
      if (sort === "name") return (a.name||"").localeCompare(b.name||"");
      if (sort === "form") return num(b.form) - num(a.form);
      if (sort === "ppg") return num(b.ppg) - num(a.ppg);
      if (sort === "tsb") return num(b.tsb) - num(a.tsb);
      return num(b.pts) - num(a.pts);
    });
  }, [players, pos, gw, club, q, sort, isAvailable, current]);
  const compare = compareId ? players[compareId] : null;
  const fixOf = (pl) => { const l = playerFixtureLabels(fixtures, teamsById, pl.teamId); return l.length ? l.join(", ") : "—"; };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h3>{compare ? "Compare Players" : ("Select " + pos)}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {compare ? (
            <div className="cmp">
              <div className="col"><h4>CURRENT PICK</h4>{current ? <F4CompareCol pl={current} fixOf={fixOf} boot={boot} /> : <div style={{ textAlign:'center', color:'var(--ink-mute)', paddingTop:20 }}>Empty slot</div>}</div>
              <div className="vs">VS</div>
              <div className="col"><h4>CANDIDATE</h4><F4CompareCol pl={compare} fixOf={fixOf} boot={boot} /></div>
            </div>
          ) : (
            <React.Fragment>
              <div className="pk-controls">
                <input className="pk-input" placeholder="Search player name…" value={q} onChange={e=>setQ(e.target.value)} />
                <div className="row2">
                  <select className="pk-select" value={club} onChange={e=>setClub(e.target.value)}>
                    <option value="">All clubs</option>
                    {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                  <select className="pk-select" value={sort} onChange={e=>setSort(e.target.value)}>
                    <option value="pts">Sort by Points</option>
                    <option value="form">Sort by Form</option>
                    <option value="ppg">Sort by PPG</option>
                    <option value="tsb">Sort by TSB</option>
                    <option value="name">Sort by Name</option>
                  </select>
                </div>
              </div>
              {candidates.length === 0 ? <div className="empty-mini">No available players match — they may already be used this season/half.</div> : candidates.slice(0, 120).map(pl => {
                const st = statusInfo(pl);
                return (
                  <div key={pl.id} className="pcard">
                    <TeamBadge short={pl.teamShort} boot={boot} size={30} />
                    <div className="pinfo">
                      <div className="pname">{pl.name} <span style={{ fontWeight:400, color:'var(--ink-mute)', fontSize:12 }}>({pl.teamShort})</span>{!st.ok && <span style={{ color:st.color, fontSize:11 }}> · {st.label}</span>}</div>
                      <div className="pmeta">Fix <b>{fixOf(pl)}</b> · Form <b>{fmtNum(pl.form)}</b> · PPG <b>{fmtNum(pl.ppg)}</b> · Pts <b>{fmtNum(pl.pts)}</b> · TSB <b>{fmtTSB(pl.tsb)}</b></div>
                    </div>
                    <div className="pacts">
                      <button className="btn btn-ghost btn-sm" onClick={()=>setCompareId(pl.id)}>Compare</button>
                      <button className="btn btn-primary btn-sm" onClick={()=>onPick(pl.id)}>Pick</button>
                    </div>
                  </div>
                );
              })}
              {candidates.length > 120 ? <p className="helper" style={{ marginTop:8 }}>Showing first 120 — use search or the club filter to narrow down.</p> : null}
            </React.Fragment>
          )}
        </div>
        <div className="modal-foot">
          {compare ? (
            <React.Fragment>
              <button className="btn btn-ghost btn-sm" onClick={()=>setCompareId(null)}>Back to list</button>
              <button className="btn btn-primary btn-sm" onClick={()=>onPick(compare.id)}>Swap to {compare.name}</button>
            </React.Fragment>
          ) : (
            <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
          )}
        </div>
      </div>
    </div>
  );
}

function SurvivorTab({ state, myPred, fpl, survivorRounds, updateMyPred, showToast }) {
  const boot = fpl.boot;
  const me = myPred.name;
  if (!state.survivorEnabled) return <div className="empty"><div className="empty-title">SURVIVOR OFF</div><p>The survivor game isn't running right now.</p></div>;
  const active = activeSurvivorRound(survivorRounds);
  if (!active) {
    const last = (survivorRounds || [])[(survivorRounds || []).length - 1];
    const wonMsg = last && last.status === "settled" ? ("Round " + last.no + " is done — winners: " + last.winners.join(", ") + ".") : "";
    return <div className="empty"><div className="empty-title">NO ACTIVE ROUND</div><p>{wonMsg} The admin will start the next survivor round soon — everyone re-enters and all teams reset.</p></div>;
  }
  const gw = active.currentGW;
  const locked = gwLocked(state, fpl, gw);
  const amAlive = active.alive.includes(me);
  let elimGW = null;
  Object.keys(active.elimByGW || {}).forEach(g => { if ((active.elimByGW[g] || []).includes(me)) elimGW = Number(g); });
  const myPick = (myPred.survivor && myPred.survivor[gw]) || null;

  const allFx = allLoadedFixtures(fpl);
  const gwFx = (fpl.fixturesByGW && fpl.fixturesByGW[gw]) || [];
  const bottom3 = survivorBottom3(allFx, boot && boot.teams, gw);
  const blockTop = (state.survivorBlockTop != null) ? Number(state.survivorBlockTop) : 3;
  const topN = survivorTopN(allFx, boot && boot.teams, gw, blockTop);
  const blocked = survivorBlocked(gwFx, bottom3, topN);
  const used = survivorUsed(myPred, active.startGW, gw);
  const fullName = (short) => { const t = boot && boot.teams && Object.values(boot.teams).find(x => x.short === short); return t ? t.name : short; };

  const sides = [];
  gwFx.forEach(f => {
    sides.push({ short: f.teamH, id: f.teamHId, opp: f.teamA, ha: "H" });
    sides.push({ short: f.teamA, id: f.teamAId, opp: f.teamH, ha: "A" });
  });
  sides.sort((a,b) => fullName(a.short).localeCompare(fullName(b.short)));

  const choose = (short) => {
    if (locked) { showToast("Locked for this gameweek"); return; }
    const b = blocked[short];
    if (b) {
      showToast(b.why === 'top'
        ? short + " is blocked — currently " + b.label + " in the table"
        : short + " is blocked — plays bottom-3 side " + b.label.replace(/^vs /, ""));
      return;
    }
    if (used[short] && myPick !== short) { showToast(short + " already used this round"); return; }
    updateMyPred(p => ({ ...p, survivor: { ...p.survivor, [gw]: short } }));
  };
  const clear = () => { if (locked) { showToast("Locked for this gameweek"); return; } updateMyPred(p => ({ ...p, survivor: { ...p.survivor, [gw]: undefined } })); };

  const roundHead = (
    <div className="card" style={{ marginBottom:16, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10 }}>
      <div><div style={{ fontFamily:'Anton', fontSize:24 }}>Round {active.no}</div><div className="helper" style={{ margin:0 }}>Gameweek {gw} · {active.alive.length} still alive</div></div>
      <div style={{ textAlign:'right' }}>
        {amAlive
          ? <span style={{ fontFamily:'JetBrains Mono', fontSize:12, color:'var(--accent-2)', fontWeight:700 }}>● ALIVE</span>
          : <span style={{ fontFamily:'JetBrains Mono', fontSize:12, color:'var(--red)', fontWeight:700 }}>✕ OUT{elimGW?(" · GW"+elimGW):""}</span>}
      </div>
    </div>
  );

  if (!amAlive) {
    return (
      <div>
        {roundHead}
        <div className="empty"><div className="empty-title">YOU'RE OUT OF ROUND {active.no}</div><p>{elimGW?("Knocked out in GW"+elimGW+". "):""}Sit tight — you're back in when the admin starts the next round. Score Predictions, Fantastic Four and Bonus all carry on as normal.</p></div>
      </div>
    );
  }

  if (locked) {
    return (
      <div>
        {roundHead}
        <div className="lock-banner">🔒 GW{gw} is locked — waiting on results.</div>
        <div className="card">
          <div className="card-title" style={{ fontSize:16 }}>Your pick</div>
          {myPick ? <p style={{ fontSize:15 }}>You backed <strong style={{ color:'var(--accent)' }}>{fullName(myPick)}</strong> to win. Good luck.</p>
                  : <p style={{ color:'var(--red)' }}>You didn't pick in time — you're eliminated this round once results are in.</p>}
        </div>
      </div>
    );
  }

  return (
    <div>
      {roundHead}
      <p className="helper" style={{ marginBottom:12 }}>Pick one team to <strong>win</strong> GW{gw}. Win → you advance. Draw, loss or no pick → you're out. Each team is usable once per round.{topN.length ? <> The <strong>top {topN.length}</strong> can't be picked at all, and you can't pick the opponent of a bottom-3 side.</> : <> You cannot pick the opponent of a team in the bottom 3 of the league table or any club currently in the top 3 of the league table..</>}</p>
      {(topN.length > 0 || bottom3.length > 0) && (
        <div className="card" style={{ marginBottom:14, padding:'12px 14px', display:'grid', gap:10 }}>
          {topN.length > 0 && (
            <div>
              <div style={{ fontFamily:'JetBrains Mono', fontSize:11, letterSpacing:'0.08em', color:'var(--ink-mute)', textTransform:'uppercase', marginBottom:6 }}>Top {topN.length} this week — off limits</div>
              <div style={{ fontSize:13 }}>{topN.join(", ")} — you can't back the league's front-runners. Their opponents are fair game.</div>
            </div>
          )}
          {bottom3.length > 0 && (
            <div style={topN.length ? { borderTop:'1px solid var(--line)', paddingTop:10 } : null}>
              <div style={{ fontFamily:'JetBrains Mono', fontSize:11, letterSpacing:'0.08em', color:'var(--ink-mute)', textTransform:'uppercase', marginBottom:6 }}>Bottom 3 this week</div>
              <div style={{ fontSize:13 }}>{bottom3.join(", ")} — their opponents are blocked. You may back a bottom-3 club itself.</div>
            </div>
          )}
        </div>
      )}
      <div className="team-grid">
        {sides.map(t => {
          const isUsed = !!used[t.short] && myPick !== t.short;
          const isBlocked = !!blocked[t.short];
          const disabled = isUsed || isBlocked;
          const sel = myPick === t.short;
          return (
            <div key={t.short+t.ha} className={"team-chip" + (sel?" selected":"") + (disabled?" sv-disabled":"")} onClick={()=>choose(t.short)} title={fullName(t.short)}>
              <TeamBadge short={t.short} code={boot&&boot.teams&&boot.teams[t.id]?boot.teams[t.id].code:null} boot={boot} size={20} />
              <span style={{ marginLeft:6 }}>{t.short}</span>
              <span className="uses" style={isBlocked && blocked[t.short].why==='top' ? { color:'var(--yellow)' } : null}>
                {isBlocked ? blocked[t.short].label : isUsed ? "used" : (t.ha + " v " + t.opp)}
              </span>
            </div>
          );
        })}
      </div>
      {sides.length === 0 && <div className="empty-mini">No fixtures loaded for GW{gw} yet.</div>}
      {myPick && <div style={{ marginTop:14 }}><button className="btn btn-ghost btn-sm" onClick={clear}>✕ Clear pick</button></div>}
      {Object.keys(used).length > 0 && (
        <p className="helper" style={{ marginTop:14 }}>Used this round: {Object.keys(used).join(", ")}</p>
      )}
    </div>
  );
}

function BonusPlayerSelect({ boot, value, onChange, disabled }) {
  const teams = (boot && boot.teams) ? Object.values(boot.teams).slice().sort((a,b)=>a.name.localeCompare(b.name)) : [];
  const parseTeam = (v) => { const m = v ? String(v).match(/\(([^)]+)\)\s*$/) : null; return m ? m[1] : ""; };
  const [team, setTeam] = useState(parseTeam(value));
  useEffect(() => { const t = parseTeam(value); if (t && t !== team) setTeam(t); }, [value]);
  const players = (boot && boot.players) ? Object.values(boot.players).filter(pl => pl.teamShort === team).sort((a,b)=>a.name.localeCompare(b.name)) : [];
  const sel = { background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'10px 12px', borderRadius:6 };
  return (
    <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:12 }}>
      <select value={team} disabled={disabled} onChange={e=>{ setTeam(e.target.value); onChange(""); }} style={{ ...sel, flex:'1 1 140px' }}>
        <option value="">— team —</option>
        {teams.map(t => <option key={t.id} value={t.short}>{t.name}</option>)}
      </select>
      <select value={value||""} disabled={disabled || !team} onChange={e=>onChange(e.target.value)} style={{ ...sel, flex:'1 1 170px' }}>
        <option value="">{team ? "— player —" : "pick a team first"}</option>
        {players.map(pl => { const v = pl.name + " (" + pl.teamShort + ")"; return <option key={pl.id} value={v}>{pl.name}</option>; })}
      </select>
    </div>
  );
}

function BonusTab({ state, gw, locked, myPred, fpl, updateMyPred, showToast }) {
  const boot = fpl && fpl.boot;
  const questions = (state.bonus && state.bonus[gw]) || [];
  const answers = (myPred.bonusAnswers && myPred.bonusAnswers[gw]) || {};
  const setAns = (qid, val) => {
    if (locked) { showToast("Gameweek locked"); return; }
    updateMyPred(p => ({ ...p, bonusAnswers: { ...p.bonusAnswers, [gw]: { ...(p.bonusAnswers && p.bonusAnswers[gw]), [qid]: val } } }));
  };
  const teamOpts = (boot && boot.teams) ? Object.values(boot.teams).slice().sort((a,b)=>a.name.localeCompare(b.name)) : [];
  const playerOpts = (boot && boot.players) ? Object.values(boot.players).map(pl => pl.name + " (" + pl.teamShort + ")").sort((a,b)=>a.localeCompare(b)) : [];
  const fieldStyle = { marginTop:12, width:'100%', background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'11px 12px', borderRadius:6 };
  if (!questions.length) return <div className="empty"><div className="empty-title">NO BONUS QUESTIONS</div><p>The admin hasn't posted any bonus questions for GW{gw} yet.</p></div>;
  return (
    <div>
      {locked && <div className="lock-banner">🔒 Bonus answers for GW{gw} are locked.</div>}
      {questions.map(q => {
        const ans = answers[q.id];
        const settled = q.answer !== undefined && q.answer !== null && q.answer !== "";
        const correct = settled && ans != null && String(ans) === String(q.answer);
        const type = q.type || (q.options && q.options.length ? "choice" : "text");
        const chips = type==="yesno" ? ["Yes","No"] : (q.options || []);
        return (
          <div key={q.id} className="card" style={{ marginBottom:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', gap:12, flexWrap:'wrap' }}>
              <div style={{ fontWeight:600, fontSize:15 }}>{q.text}</div>
              <div style={{ fontFamily:'Anton', color:'var(--accent)', fontSize:18 }}>{q.points} pt{q.points===1?"":"s"}</div>
            </div>
            {(type==="yesno" || type==="choice") ? (
              <div className="team-grid" style={{ marginTop:12 }}>
                {chips.map(opt => (
                  <div key={opt} className={"team-chip" + (String(ans)===String(opt)?" selected":"")} onClick={()=>setAns(q.id, opt)} style={{ cursor: locked?'not-allowed':'pointer' }}>{opt}</div>
                ))}
              </div>
            ) : type==="team" ? (
              <select value={ans||""} disabled={locked} onChange={e=>setAns(q.id, e.target.value)} style={fieldStyle}>
                <option value="">— pick a team —</option>
                {teamOpts.map(t => <option key={t.id} value={t.short}>{t.name}</option>)}
              </select>
            ) : type==="player" ? (
              <BonusPlayerSelect boot={boot} value={ans||""} disabled={locked} onChange={(v)=>setAns(q.id, v)} />
            ) : (
              <input style={fieldStyle} placeholder="Type your answer" value={ans||""} disabled={locked} onChange={e=>setAns(q.id, e.target.value)} />
            )}
            {locked && settled && (
              <div className="fx-result" style={{ marginTop:12 }}>
                <span>Correct answer: {q.answer}</span>
                <span className="pts" style={{ color: correct?'var(--accent-2)':'var(--red)' }}>{correct?("+"+q.points):"0"} pts</span>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// PICKS — see everyone's picks for LOCKED gameweeks
// ============================================================
function PicksView({ state, users, currentUser, fpl }) {
  const manualLocked = Object.keys(state.locks || {}).filter(g => state.locks[g]).map(g => parseInt(g,10));
  const _plNow = Date.now();
  const _plEvents = (fpl.boot && fpl.boot.events) || [];
  const autoLocked = _plEvents.filter(e => deadlinePassed(fpl, e.id, _plNow)).map(e => e.id);
  const lockedGWs = Array.from(new Set([...manualLocked, ...autoLocked])).sort((a,b)=>b-a);
  const [gw, setGw] = useState(lockedGWs[0] || null);
  useEffect(() => { if (gw == null && lockedGWs.length) setGw(lockedGWs[0]); }, [lockedGWs.length]);

  if (lockedGWs.length === 0) {
    return (
      <div>
        <div className="page-head"><div className="eyebrow">EVERYONE'S PICKS</div><h1 className="page-title">THE <span className="it">picks.</span></h1></div>
        <div className="empty"><div className="empty-title">NOTHING LOCKED YET</div><p>Picks stay hidden until the admin locks a gameweek. Once a GW is locked, everyone's predictions show up here with results.</p></div>
      </div>
    );
  }

  const fixtures = (fpl.fixturesByGW && fpl.fixturesByGW[gw]) || [];
  const boot = fpl.boot;
  const live = (fpl.liveByGW && fpl.liveByGW[gw]) || {};
  const selIds = (state.selectedFixtures && state.selectedFixtures[gw]) || [];
  const selFixtures = selIds.map(id => fixtures.find(f => String(f.id)===String(id))).filter(Boolean);
  const players = (boot && boot.players) || {};
  const named = (users || []).filter(u => u.name).sort((a,b)=>a.name.localeCompare(b.name));
  const bonusQs = (state.bonus && state.bonus[gw]) || [];

  const scoreCellClass = (pred, f) => {
    if (!f.finished || f.hScore == null) return "";
    const p = parseScore(pred); if (!p) return "";
    const ph = p[0], pa = p[1], ah = f.hScore, aa = f.aScore;
    if (ph === ah && pa === aa) return "pk-exact";
    const so = ph>pa?1:ph<pa?-1:0, ao = ah>aa?1:ah<aa?-1:0;
    return so === ao ? "pk-outcome" : "pk-wrong";
  };
  const pp = id => (id != null && live[id] != null) ? Number(live[id]) : null;
  const nm = id => (id != null && players[id]) ? players[id].name : "—";

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">EVERYONE'S PICKS · LOCKED</div>
        <h1 className="page-title">THE <span className="it">picks.</span></h1>
        <p className="page-sub">All predictions for locked gameweeks, with results — green = right, red = wrong.</p>
      </div>
      <div className="field" style={{ maxWidth:220 }}>
        <label>Gameweek</label>
        <select value={gw||""} onChange={e=>setGw(parseInt(e.target.value,10))}>
          {lockedGWs.map(g => <option key={g} value={g}>GW{g}</option>)}
        </select>
      </div>

      <div className="card" style={{ marginBottom:18, overflowX:'auto' }}>
        <div className="card-title">Score Predictions</div>
        {selFixtures.length === 0 ? <div className="empty-mini">No fixtures were selected for this GW.</div> : (
          <table className="lb-table" style={{ minWidth:520 }}>
            <thead><tr><th>Pundit</th>{selFixtures.map(f => <th key={f.id} style={{textAlign:'center'}}>{f.teamH} {f.finished ? (f.hScore+"-"+f.aScore) : "v"} {f.teamA}</th>)}</tr></thead>
            <tbody>
              {named.map(u => {
                const preds = (u.scores && u.scores[gw]) || {};
                return <tr key={u.name}><td style={{fontWeight:600}}>{u.name}{u.name===currentUser?" · you":""}</td>
                  {selFixtures.map(f => { const cls = scoreCellClass(preds[f.id], f); return <td key={f.id} className={cls} style={{textAlign:'center', fontFamily:'JetBrains Mono'}}>{preds[f.id]||"—"}</td>; })}
                </tr>;
              })}
            </tbody>
          </table>
        )}
        <div className="pk-legend"><span><span className="pk-dot" style={{background:'var(--accent-2)'}}></span>Exact score</span><span><span className="pk-dot" style={{background:'var(--yellow)'}}></span>Right result</span><span><span className="pk-dot" style={{background:'var(--red)'}}></span>Wrong</span></div>
      </div>

      <div className="grid grid-2">
        <div className="card">
          <div className="card-title">Survivor</div>
          <table className="lb-table">
            <thead><tr><th>Pundit</th><th>Pick</th><th>Result</th></tr></thead>
            <tbody>
              {named.map(u => {
                const sp = (u.survivor && u.survivor[gw]) || null;
                const r = sp ? teamSurvives(sp, gw, fixtures) : null;
                const cls = (r && r.decided) ? (r.survives ? "pk-good" : "pk-bad") : "";
                return <tr key={u.name}><td style={{fontWeight:600}}>{u.name}{u.name===currentUser?" · you":""}</td>
                  <td style={{fontFamily:'JetBrains Mono'}}>{sp || "—"}</td>
                  <td className={cls} style={{fontFamily:'JetBrains Mono', fontSize:12}}>{(r && r.decided) ? (r.survives ? "✓ won" : "✗ out") : (sp ? "—" : "")}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
        <div className="card" style={{ overflowX:'auto' }}>
          <div className="card-title">Fantastic Four</div>
          <table className="lb-table" style={{ minWidth:420 }}>
            <thead><tr><th>Pundit</th><th>GK</th><th>DEF</th><th>MID</th><th>FWD</th><th>Pts</th></tr></thead>
            <tbody>
              {named.map(u => {
                const f4 = (u.f4 && u.f4[gw]) || {};
                const ids = [f4.gk, f4.def, f4.mid, f4.fwd];
                const tot = ids.reduce((a,id)=>a+(pp(id)||0), 0);
                const cell = (id,key) => { const v = pp(id); return <td key={key} className={v>0?"pk-good":""}>{nm(id)}{v!=null?(" "+v):""}</td>; };
                return <tr key={u.name}><td style={{fontWeight:600}}>{u.name}{u.name===currentUser?" · you":""}</td>
                  {cell(f4.gk,"gk")}{cell(f4.def,"def")}{cell(f4.mid,"mid")}{cell(f4.fwd,"fwd")}
                  <td style={{fontFamily:'Anton', color:'var(--accent-2)'}}>{tot}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>

      {bonusQs.length > 0 && (
        <div className="card" style={{ marginTop:18, overflowX:'auto' }}>
          <div className="card-title">Bonus answers</div>
          <table className="lb-table" style={{ minWidth:480 }}>
            <thead><tr><th>Pundit</th>{bonusQs.map(q => <th key={q.id}>{q.text}{q.answer!=null && q.answer!=="" ? (" → " + q.answer) : ""}</th>)}</tr></thead>
            <tbody>
              {named.map(u => {
                const ba = (u.bonusAnswers && u.bonusAnswers[gw]) || {};
                return <tr key={u.name}><td style={{fontWeight:600}}>{u.name}{u.name===currentUser?" · you":""}</td>
                  {bonusQs.map(q => { const a = ba[q.id]; const settled = q.answer != null && q.answer !== ""; const has = a != null && a !== ""; const cls = (settled && has) ? (String(a)===String(q.answer) ? "pk-good" : "pk-bad") : ""; return <td key={q.id} className={cls} style={{fontFamily:'JetBrains Mono'}}>{has ? a : "—"}</td>; })}</tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ============================================================
// LEADERBOARD
// ============================================================
function LeaderboardView({ standings, currentUser, state, users, fpl, fplBusy, onRefresh, survivorPts, survivorWins }) {
  const [board, setBoard] = useState("overall");   // overall | scoreline | f4 | survivor
  const [mode, setMode] = useState("overall");      // overall (cumulative) | gw
  const activeGW = state.activeGW || 1;
  const [gwSel, setGwSel] = useState(activeGW);
  const [detail, setDetail] = useState(null);
  const sp = survivorPts || {};

  const prev = activeGW > 1 ? computeStandings(users, state, fpl, activeGW - 1) : [];
  const comp = (s2, useGW) => {
    const b = useGW ? ((s2.perGW && s2.perGW[gwSel]) || { scores:0, f4:0, bonus:0 })
                    : { scores:s2.breakdown.scores, f4:s2.breakdown.f4, bonus:s2.breakdown.bonus||0 };
    const total = board==="scoreline" ? b.scores : board==="f4" ? b.f4 : (b.scores + b.f4 + b.bonus);
    return { ...b, total };
  };
  const boardTotal = (s2) => board==="survivor" ? (sp[s2.name] || 0) : comp(s2, mode==="gw").total;
  const rows = [...standings].sort((a,b) => boardTotal(b) - boardTotal(a));
  const prevSorted = [...prev].sort((a,b) => comp(b,false).total - comp(a,false).total);
  const prevRank = {}; prevSorted.forEach((s2,i) => { prevRank[s2.name] = i+1; });
  const detailStanding = detail ? standings.find(s2 => s2.name === detail) : null;

  const potName = board==="overall" ? "Overall (summary)" : board==="scoreline" ? "Scoreline" : board==="f4" ? "Fantastic Four" : "Survivor";
  const potDesc = board==="overall" ? "Score + F4 + Bonus combined — the summary table (no separate prize)."
    : board==="scoreline" ? "Prize pot — score predictions only."
    : board==="f4" ? "Prize pot — Fantastic Four only."
    : "Prize pot — 1 point per week survived, plus a winner bonus when a round settles.";
  const showModeSeg = board !== "survivor";

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">SEASON STANDINGS · {state.season}</div>
        <h1 className="page-title">THE <span className="it">table.</span></h1>
      </div>
      <div className="nav" style={{ marginBottom:16 }}>
        <button className={board==="overall"?"active":""} onClick={()=>setBoard("overall")}>Overall</button>
        <button className={board==="scoreline"?"active":""} onClick={()=>setBoard("scoreline")}>Scoreline</button>
        <button className={board==="f4"?"active":""} onClick={()=>setBoard("f4")}>Fantastic Four</button>
        <button className={board==="survivor"?"active":""} onClick={()=>setBoard("survivor")}>Survivor</button>
      </div>
      <div className="lb-head-card">
        <div style={{ fontSize:14 }}>🏆 <strong>{potName}:</strong> <span style={{ color:'var(--ink-dim)' }}>{potDesc}{showModeSeg && mode==="gw" ? (" GW"+gwSel+" only.") : ""}</span></div>
        {showModeSeg && (
          <div className="lb-modeseg">
            <button className={mode==="overall"?"active":""} onClick={()=>setMode("overall")}>OVERALL</button>
            <button className={mode==="gw"?"active":""} onClick={()=>setMode("gw")}>GW</button>
            {mode==="gw" && (
              <select value={gwSel} onChange={e=>setGwSel(parseInt(e.target.value,10))}>
                {Array.from({length: activeGW}, (_,i)=>i+1).map(g => <option key={g} value={g}>GW{g}</option>)}
              </select>
            )}
          </div>
        )}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
        <div className="lb-colhead-lbl">RANK / MANAGER</div>
        <button className="btn btn-ghost btn-sm" onClick={onRefresh} disabled={fplBusy}>{fplBusy?"↻ Refreshing…":"↻ Refresh"}</button>
      </div>
      {rows.length === 0 ? (
        <div className="empty"><div className="empty-title">NO POINTS YET</div><p>Once results land, the table fills in here.</p></div>
      ) : rows.map((s2, i) => {
        const v = board==="survivor"
          ? { scores:0, f4:0, bonus:0, rounds: (survivorWins && survivorWins[s2.name]) || 0, total: sp[s2.name] || 0 }
          : comp(s2, mode==="gw");
        const pr = prevRank[s2.name];
        const delta = (board!=="survivor" && mode==="overall" && prev.length && pr) ? (pr - (i+1)) : null;
        return <LeaderRow key={s2.name} s={s2} i={i} v={v} delta={delta} board={board} isYou={s2.name===currentUser} onClick={()=>setDetail(s2.name)} />;
      })}
      {detailStanding && <Portal><PlayerDetailModal standing={detailStanding} onClose={()=>setDetail(null)} /></Portal>}
      <p className="helper" style={{ marginTop:14 }}>Tap any pundit for their gameweek-by-gameweek breakdown. Three prize pots — <strong>Scoreline</strong>, <strong>Fantastic Four</strong> and <strong>Survivor</strong> — plus the combined <strong>Overall</strong> summary (Score + F4 + Bonus).{board!=="survivor" && mode==="overall"?" Arrows show movement since last gameweek.":""}</p>
    </div>
  );
}

function LeaderRow({ s, i, v, delta, board, isYou, onClick }) {
  const rankColor = i===0 ? "var(--yellow)" : i===1 ? "#cfd0d4" : i===2 ? "#d4824a" : "var(--ink-mute)";
  const move = delta==null ? null : delta>0 ? { t:"▲ UP "+delta, c:"var(--accent-2)" } : delta<0 ? { t:"▼ DOWN "+(-delta), c:"var(--red)" } : { t:"— no change", c:"var(--ink-mute)" };
  const boxes = board==="overall" ? [["SCORES",v.scores],["F4",v.f4],["BONUS",v.bonus]]
    : board==="scoreline" ? [["SCORES",v.scores]]
    : board==="f4" ? [["F4",v.f4]]
    : [["ROUND WINS",v.rounds]];
  const totLabel = board==="survivor" ? "SURVIVOR PTS" : "TOTAL PTS";
  return (
    <div className="lb-row" onClick={onClick}>
      <div className="lb-row-rank" style={{ color:rankColor }}>{i>=3?"#":""}{i+1}</div>
      <div className="lb-row-name">
        <div className="lb-row-mgr">{s.name}{isYou?<span style={{color:'var(--accent-2)', fontSize:13}}> · you</span>:""}</div>
        {move && <div className="lb-row-move" style={{ color:move.c }}>{move.t}</div>}
      </div>
      <div className="lb-row-stats">
        {boxes.map(([l,val]) => <div key={l} className={"lb-statbox" + (l==="BONUS"?" bonus":"")}><div className="lb-sb-l">{l}</div><div className="lb-sb-v">{val}</div></div>)}
      </div>
      <div className="lb-row-total">
        <div className="lb-tot-l">{totLabel}</div>
        <div className="lb-tot-v">{v.total}</div>
      </div>
    </div>
  );
}

function PlayerDetailModal({ standing, onClose }) {
  const perGW = standing.perGW || {};
  const gws = Object.keys(perGW).map(Number).sort((a,b)=>b-a);

  const highest = totals.length ? Math.max(...totals) : 0;

  const avg = totals.length ? (standing.total / totals.length) : 0;
  return (
    <div className="modal-overlay" onClick={onClose}>

            <div className="pd-sum"><div className="pd-sum-l">HIGHEST GW</div><div className="pd-sum-v">{highest}</div></div>
            <div className="pd-sum"><div className="pd-sum-l">LOWEST GW</div><div className="pd-sum-v">{lowest}</div></div>

function csvEscape(v) {
  const s = (v == null ? "" : String(v));
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(filename, rows) {
  const content = rows.map(r => r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function buildPicksCSV(users, state, fpl) {
  const players = (fpl.boot && fpl.boot.players) || {};
  const rows = [["Pundit","Gameweek","Section","Item","Pick","EditedAt"]];
  const maxGW = state.activeGW || 1;
  (users || []).filter(u=>u.name).sort((a,b)=>a.name.localeCompare(b.name)).forEach(u => {
    const edited = u.lastEdited ? new Date(u.lastEdited).toISOString() : "";
    for (let gw = 1; gw <= maxGW; gw++) {
      const selIds = (state.selectedFixtures && state.selectedFixtures[gw]) || [];
      const fixtures = (fpl.fixturesByGW && fpl.fixturesByGW[gw]) || [];
      const preds = (u.scores && u.scores[gw]) || {};
      selIds.forEach(fid => {
        const fx = fixtures.find(f => String(f.id)===String(fid));
        const label = fx ? `${fx.teamH}v${fx.teamA}` : ("fixture "+fid);
        if (preds[fid]) rows.push([u.name, gw, "Score", label, preds[fid], edited]);
      });
      const tp = (u.teamPick && u.teamPick[gw]) || null;
      if (tp && tp.team) rows.push([u.name, gw, "Team", "Team of the Week", tp.team + (tp.oppTag?` (${tp.oppTag})`:""), edited]);
      const f4 = (u.f4 && u.f4[gw]) || null;
      if (f4) ["gk","def","mid","fwd"].forEach(slot => {
        if (f4[slot]) rows.push([u.name, gw, "F4", slot.toUpperCase(), players[f4[slot]]?players[f4[slot]].name:("player "+f4[slot]), edited]);
      });
      const sp = (u.survivor && u.survivor[gw]) || null;
      if (sp && sp.team) rows.push([u.name, gw, "Survivor", "Survivor pick", sp.team, edited]);
      const bq = (state.bonus && state.bonus[gw]) || [];
      const ba = (u.bonusAnswers && u.bonusAnswers[gw]) || {};
      bq.forEach(q => { if (ba[q.id] != null && ba[q.id] !== "") rows.push([u.name, gw, "Bonus", q.text, ba[q.id], edited]); });
    }
  });
  return rows;
}
function buildResultsCSV(users, state, fpl) {
  const rows = [["Pundit","Gameweek","ScorePts","TeamPts","F4Pts","BonusPts","GWTotal"]];
  (users || []).filter(u=>u.name).forEach(u => {
    const season = computeUserSeason(u, state, fpl);
    Object.entries(season.perGW).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).forEach(([gw,v]) => {
      rows.push([u.name, gw, v.scores, v.team, v.f4, (v.bonus||0), v.total]);
    });
  });
  return rows;
}
function buildLeaderboardCSV(standings) {
  const rows = [["Rank","Pundit","ScorePts","TeamPts","F4Pts","BonusPts","Total"]];
  standings.forEach((s,i) => rows.push([i+1, s.name, s.breakdown.scores, s.breakdown.team, s.breakdown.f4, (s.breakdown.bonus||0), s.total]));
  return rows;
}

// There is no admin login form any more, because there is nothing to log in
// WITH. `isAdmin` arrives from GET /api/auth, which reads the signed HttpOnly
// session cookie and compares the Google email against the server's
// ADMIN_EMAILS list. This component cannot be talked into granting access, and
// even if someone patches it to render, every write it offers is independently
// re-authorised by /api/store against the same server-side list.
function AdminView({ state, users, standings, fpl, updateState, isAdmin, adminEmail, showToast, onRefresh, adminAddUser, adminDeleteUser, setSurvivorOn }) {
  if (!isAdmin) {
    return (
      <div>
        <div className="page-head"><div className="eyebrow">RESTRICTED</div><h1 className="page-title">ADMIN <span className="it">only.</span></h1></div>
        <div className="login-card" style={{ maxWidth:440, margin:'0 auto' }}>
          <p className="helper" style={{ marginTop:0 }}>
            The admin deck is tied to one specific Google account. There is no admin password to enter —
            if you're signed in with an approved account it appears automatically.
          </p>
        </div>
      </div>
    );
  }
  return <AdminDashboard state={state} users={users} standings={standings} fpl={fpl} updateState={updateState} showToast={showToast} onRefresh={onRefresh} adminAddUser={adminAddUser} adminDeleteUser={adminDeleteUser} setSurvivorOn={setSurvivorOn} adminEmail={adminEmail} />;
}

function AdminDashboard({ state, users, standings, fpl, updateState, showToast, onRefresh, adminAddUser, adminDeleteUser, setSurvivorOn, adminEmail }) {
  const boot = fpl.boot;
  const now = Date.now();
  const activeGW = state.activeGW || 1;
  const openGWs = (state.openGWs && state.openGWs.length) ? state.openGWs.slice().sort((a,b)=>a-b) : [activeGW];
  const fxSelectable = Array.from(new Set([...openGWs, activeGW])).sort((a,b)=>a-b);
  const [fxGW, setFxGW] = useState(activeGW);
  const fixtures = (fpl.fixturesByGW && fpl.fixturesByGW[fxGW]) || [];
  const selIds = (state.selectedFixtures && state.selectedFixtures[fxGW]) || [];
  const [newQ, setNewQ] = useState({ text: "", options: "", points: 3, type: "text" });
  const namedUsers = (users || []).filter(u => u.name).sort((a,b)=>a.name.localeCompare(b.name));
  const doDeleteUser = async (name) => {
    if (!window.confirm("Delete " + name + "? This removes their account and all their picks. No undo.")) return;
    const r = await adminDeleteUser(name);
    if (r && r.ok) showToast(name + " deleted");
    else showToast((r && r.msg) || "Couldn't delete");
  };
  const bonusList = (state.bonus && state.bonus[activeGW]) || [];
  const bonusTeamOpts = (boot && boot.teams) ? Object.values(boot.teams).slice().sort((a,b)=>a.name.localeCompare(b.name)) : [];
  const bonusPlayerOpts = (boot && boot.players) ? Object.values(boot.players).map(pl => pl.name + " (" + pl.teamShort + ")").sort((a,b)=>a.localeCompare(b)) : [];
  const addBonus = () => {
    if (!newQ.text.trim()) { showToast("Enter a question first"); return; }
    const bt = newQ.type || "text";
    const opts = bt==="yesno" ? ["Yes","No"] : bt==="choice" ? newQ.options.split(",").map(x=>x.trim()).filter(Boolean) : [];
    const q = { id: "q" + Date.now().toString(36), text: newQ.text.trim(), type: bt, options: opts, answer: "", points: Number(newQ.points)||1 };
    updateState(st => ({ ...st, bonus: { ...(st.bonus||{}), [activeGW]: [ ...(((st.bonus||{})[activeGW])||[]), q ] } }));
    setNewQ({ text: "", options: "", points: 3, type: "text" });
  };
  const setBonusAnswer = (qid, ans) => updateState(st => ({ ...st, bonus: { ...(st.bonus||{}), [activeGW]: (((st.bonus||{})[activeGW])||[]).map(q => q.id===qid ? { ...q, answer: ans } : q) } }));
  const delBonus = (qid) => updateState(st => ({ ...st, bonus: { ...(st.bonus||{}), [activeGW]: (((st.bonus||{})[activeGW])||[]).filter(q => q.id!==qid) } }));
  const toggleSurvivor = () => setSurvivorOn(!state.survivorEnabled);
  const survRounds = computeAllSurvivorRounds(state, users, fpl);
  const survActive = activeSurvivorRound(survRounds);
  const startNewRound = () => {
    if (survActive) { showToast("Finish the current round before starting a new one"); return; }
    const rounds = (state.survivorRounds || []);
    const no = rounds.length + 1;
    const startGW = state.activeGW || 1;
    updateState(st => ({ ...st, survivorRounds: [ ...((st.survivorRounds)||[]), { id: "r" + Date.now().toString(36), no, startGW } ] }));
    showToast("Started survivor round " + no + " from GW" + startGW);
  };
  const removeRound = (id) => {
    const r = (state.survivorRounds || []).find(x => x.id === id);
    if (!r) return;
    if (typeof window !== "undefined" && window.confirm && !window.confirm("Remove survivor round " + r.no + "? Use this to undo a mis-started round. (Picks stay saved but this round won't count.)")) return;
    updateState(st => ({ ...st, survivorRounds: (st.survivorRounds || []).filter(x => x.id !== id) }));
    showToast("Removed round " + r.no);
  };

  const setActiveGW = (v) => { const n = Math.max(1, Math.min(TOTAL_GW, v)); updateState(s => ({ ...s, activeGW: n })); };
  const toggleOpenGW = (gw) => updateState(s => {
    const cur = (s.openGWs && s.openGWs.length) ? s.openGWs.slice() : [s.activeGW||1];
    const next = cur.includes(gw) ? cur.filter(x=>x!==gw) : [...cur, gw];
    return { ...s, openGWs: next.length ? next.sort((a,b)=>a-b) : [s.activeGW||1] };
  });
  const toggleLock = (gw) => updateState(s => ({ ...s, locks: { ...s.locks, [gw]: !s.locks[gw] } }));
  const toggleFixture = (fid) => updateState(s => {
    const cur = (s.selectedFixtures && s.selectedFixtures[fxGW]) || [];
    const next = cur.map(String).includes(String(fid)) ? cur.filter(x => String(x)!==String(fid)) : [...cur, fid];
    return { ...s, selectedFixtures: { ...s.selectedFixtures, [fxGW]: next } };
  });
  const setScoring = (key, v) => updateState(s => ({ ...s, scoring: { ...(s.scoring||DEFAULT_SCORING), [key]: Number(v) } }));

  const forceResync = async () => {
    if (!window.confirm("Force every other device to re-sync and re-login on next open? No data is deleted — this only clears stale sessions (use after a wipe).")) return;
    const e = Date.now();
    await setShared("pp_epoch", e);
    try { localStorage.setItem("pp_epoch_seen", JSON.stringify(e)); } catch {}
    showToast("Done — other devices will re-sync + re-login on next open.");
  };
  const resetAll = async () => {
    if (!window.confirm("Wipe ALL league data (every pundit's picks AND all settings)? This cannot be undone.")) return;
    if (!window.confirm("Really sure? Type-check: this deletes everything under pp_. Click OK to proceed.")) return;
    await remoteWipePrefix("pp_");
    const _ep = Date.now();
    await setShared("pp_epoch", _ep);   // new generation -> every other device re-syncs + re-logs-in
    try { Object.keys(localStorage).filter(k=>k.startsWith("pp_")).forEach(k=>localStorage.removeItem(k)); } catch {}
    try { localStorage.setItem("pp_epoch_seen", JSON.stringify(_ep)); } catch {}
    showToast("All data wiped. Reload the page.");
  };

  const sc = state.scoring || DEFAULT_SCORING;
  const scoringFields = [
    ["scoreOutcome","Score · correct outcome"],["scoreExact","Score · exact result"],
    ["gfOutcome","Goal Fest · outcome bonus"],["gfExact","Goal Fest · exact bonus"],["gfThreshold","Goal Fest · total must exceed"],
    ["teamWin","Team · correct win"],["teamOverPenalty","Team · over-limit penalty"],["teamMaxUses","Team · max uses/season"],
    ["f4Multiplier","F4 · points multiplier"],
  ];

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">CONTROL ROOM</div>
        <h1 className="page-title">ADMIN <span className="it">deck.</span></h1>
        <p className="page-sub" style={{ fontSize:14 }}>Signed in as <strong style={{ color:'var(--ink)' }}>{adminEmail || "an approved admin account"}</strong> — verified by Google on the server. Only accounts on the server's admin list can see or use this page.</p>
      </div>

      <div className="grid grid-2">
        <div className="card">
          <div className="card-title">Gameweek</div>
          <p className="helper" style={{ marginBottom:12 }}>FPL current GW: <strong style={{color:'var(--ink)'}}>{boot && boot.currentGW ? boot.currentGW : "—"}</strong>{boot && boot.nextGW ? ` · next: ${boot.nextGW}` : ""}. Set the gameweek pundits are predicting.</p>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <button className="btn" onClick={()=>setActiveGW(activeGW-1)}>−</button>
            <div style={{ fontFamily:'Anton', fontSize:44, minWidth:80, textAlign:'center' }}>{activeGW}</div>
            <button className="btn" onClick={()=>setActiveGW(activeGW+1)}>+</button>
            {boot && boot.currentGW && boot.currentGW!==activeGW && <button className="btn btn-ghost btn-sm" onClick={()=>setActiveGW(boot.currentGW)}>Match FPL (GW{boot.currentGW})</button>}
          </div>
          <div style={{ marginTop:16 }}>
            <button className="btn btn-ghost btn-sm" onClick={onRefresh}>↻ Refresh FPL data</button>
          </div>
        </div>

        <div className="card">
          <div className="card-title">Survivor</div>
          <p className="helper" style={{ marginBottom:12 }}>Multi-round knockout. Players score <strong>1 point for every week they survive</strong>, plus the winner bonus below when a round settles (3 or fewer left). If everyone falls the same week that week scores nothing but earlier points are kept. Start a round when you want the next one to begin — it opens from the current active gameweek and everyone re-enters with all teams reset.</p>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:14 }}>
            <button className={"btn btn-sm " + (state.survivorEnabled?"btn-go":"btn-ghost")} onClick={toggleSurvivor}>{state.survivorEnabled ? "✓ Survivor ON" : "Survivor OFF"}</button>
            <button className="btn btn-primary btn-sm" onClick={startNewRound} disabled={!state.survivorEnabled || !!survActive}>+ Start new round (from GW{activeGW})</button>
            {survActive && <span className="helper" style={{ margin:0 }}>Round {survActive.no} is live — {survActive.alive.length} alive. Finish it first.</span>}

            const on = openGWs.includes(g);
            return <button key={g} className={"team-chip" + (on?" selected":"")} onClick={()=>toggleOpenGW(g)} style={{ minWidth:64 }}>
              GW{g}<span className="uses">{on?"open":"closed"}{g===activeGW?" · now":""}</span></button>;
          })}
        </div>
      </div>

      <div className="card" style={{ marginTop:18 }}>
        <div className="card-title">Pundits <span style={{ fontFamily:'JetBrains Mono', fontSize:12, color:'var(--ink-mute)' }}>{namedUsers.length} pundits</span></div>
        <p className="helper" style={{ marginBottom:14 }}>Everyone signs in with Google and picks their own display name — no passwords to manage. Remove a pundit here if you need to (deletes their account and all their picks — no undo).</p>
        {namedUsers.length === 0 ? <div className="empty-mini">No pundits yet.</div> : namedUsers.map(u => (
          <div key={u.name} className="fixture" style={{ marginBottom:10 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', justifyContent:'space-between' }}>
              <div style={{ fontWeight:700 }}>{u.name}{u.email ? <span style={{ color:'var(--ink-mute)', fontSize:11, marginLeft:8 }}>{u.email}</span> : null}</div>
              <button className="btn btn-danger btn-sm" onClick={()=>doDeleteUser(u.name)}>Delete</button>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{ marginTop:18 }}>
        <div className="card-title">Score-prediction fixtures
          <span style={{ fontFamily:'JetBrains Mono', fontSize:12, color: selIds.length===state.scoresPerGW?'var(--accent-2)':'var(--ink-mute)' }}>{selIds.length} selected (target {state.scoresPerGW}{fixtures.length>state.scoresPerGW?", +extras for DGW":""})</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10, margin:'2px 0 14px' }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:11, letterSpacing:'0.1em', color:'var(--ink-mute)' }}>EDITING</span>
          <select value={fxGW} onChange={e=>setFxGW(parseInt(e.target.value,10))} style={{ background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'7px 10px', borderRadius:4, fontWeight:600 }}>
            {fxSelectable.map(g => <option key={g} value={g}>Gameweek {g}{g===activeGW?" · current":""}</option>)}
          </select>
        </div>
        {fixtures.length === 0 ? <div className="empty-mini">No FPL fixtures loaded for GW{fxGW}. Hit “Refresh FPL data”. (Fixtures only load once deployed on Vercel.)</div> : (
          <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
            {fixtures.map(f => {
              const on = selIds.map(String).includes(String(f.id));
              return <button key={f.id} className={"team-chip" + (on?" selected":"")} onClick={()=>toggleFixture(f.id)} style={{ minWidth:110 }}>
                {f.teamH} v {f.teamA}<span className="uses">{f.kickoff?new Date(f.kickoff).toLocaleDateString(undefined,{month:'short',day:'numeric'}):""}{on?" · counts":""}</span></button>;
            })}
          </div>
        )}
        <p className="helper" style={{ marginTop:10 }}>Pick the {state.scoresPerGW} fixtures that count for score predictions in GW{fxGW}. Add a couple more in double gameweeks.</p>
      </div>

      <div className="card" style={{ marginTop:18 }}>
        <div className="card-title">Scoring</div>
        <div className="grid grid-3">
          {scoringFields.map(([key,label]) => (
            <div className="field" key={key} style={{ marginBottom:0 }}>
              <label>{label}</label>
              <input type="number" value={sc[key]} onChange={e=>setScoring(key, e.target.value)} />
            </div>
          ))}
        </div>
        <p className="helper" style={{ marginTop:12 }}>Changing these recomputes every score instantly. Defaults match the classic Pro Pundit rules.</p>
      </div>

      <div className="card" style={{ marginTop:18 }}>
        <div className="card-title">Export data</div>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
          <button className="btn btn-go btn-sm" onClick={()=>downloadCSV("propundit_picks.csv", buildPicksCSV(users, state, fpl))}>⬇ Picks CSV</button>
          <button className="btn btn-go btn-sm" onClick={()=>downloadCSV("propundit_results.csv", buildResultsCSV(users, state, fpl))}>⬇ Results CSV</button>
          <button className="btn btn-go btn-sm" onClick={()=>downloadCSV("propundit_leaderboard.csv", buildLeaderboardCSV(standings))}>⬇ Leaderboard CSV</button>
        </div>
      </div>

      <div className="card" style={{ marginTop:18 }}>
        <div className="card-title">Bonus questions · GW{activeGW}</div>
        <p className="helper" style={{ marginBottom:14 }}>Post yes/no or multiple-choice questions for this gameweek. After the games, set the correct answer to award points — they roll into the Fantastic Four + Bonus pot. Leave options blank for a free-text answer.</p>
        {bonusList.length === 0 ? <div className="empty-mini">No bonus questions for GW{activeGW} yet.</div> : bonusList.map(q => (
          <div key={q.id} className="fixture" style={{ marginBottom:10 }}>
            <div style={{ display:'flex', justifyContent:'space-between', gap:10, flexWrap:'wrap', marginBottom:10 }}>
              <strong>{q.text}</strong>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:11, color:'var(--ink-mute)' }}>{q.points} pt{q.points===1?"":"s"}</span>
            </div>
            <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
              <span style={{ fontSize:12, color:'var(--ink-mute)' }}>Correct answer:</span>
              {(() => {
                const bt = q.type || (q.options && q.options.length ? "choice" : "text");
                const ss = { background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'7px 10px', borderRadius:3 };
                if (bt === "team") return (
                  <select value={q.answer||""} onChange={e=>setBonusAnswer(q.id, e.target.value)} style={ss}>
                    <option value="">— not settled —</option>
                    {bonusTeamOpts.map(t => <option key={t.id} value={t.short}>{t.name}</option>)}
                  </select>);
                if (bt === "player") return (
                  <BonusPlayerSelect boot={boot} value={q.answer||""} onChange={(v)=>setBonusAnswer(q.id, v)} />);
                if (q.options && q.options.length) return (
                  <select value={q.answer||""} onChange={e=>setBonusAnswer(q.id, e.target.value)} style={ss}>
                    <option value="">— not settled —</option>
                    {q.options.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>);
                return <input value={q.answer||""} onChange={e=>setBonusAnswer(q.id, e.target.value)} placeholder="type correct answer" style={ss} />;
              })()}
              <button className="btn btn-danger btn-sm" onClick={()=>delBonus(q.id)}>Delete</button>
            </div>
          </div>
        ))}
        <div className="divider" style={{ margin:'16px 0' }}></div>
        <div className="grid grid-3">
          <div className="field" style={{ marginBottom:0 }}><label>Question</label><input value={newQ.text} onChange={e=>setNewQ({ ...newQ, text: e.target.value })} placeholder="e.g. Will there be a hat-trick?" /></div>
          <div className="field" style={{ marginBottom:0 }}><label>Answer type</label>
            <select value={newQ.type} onChange={e=>setNewQ({ ...newQ, type: e.target.value })} style={{ width:'100%', background:'var(--bg-2)', border:'1px solid var(--line)', color:'var(--ink)', padding:'10px 12px', borderRadius:6 }}>
              <option value="text">Free text</option>
              <option value="yesno">Yes / No</option>
              <option value="choice">Multiple choice</option>
              <option value="team">Team dropdown</option>
              <option value="player">Player dropdown</option>
            </select>
          </div>
          <div className="field" style={{ marginBottom:0 }}><label>Points</label><input type="number" value={newQ.points} onChange={e=>setNewQ({ ...newQ, points: e.target.value })} /></div>
        </div>
        {newQ.type==="choice" && <div className="field" style={{ marginTop:12, marginBottom:0 }}><label>Options (comma separated)</label><input value={newQ.options} onChange={e=>setNewQ({ ...newQ, options: e.target.value })} placeholder="e.g. Arsenal, Chelsea, Draw" /></div>}
        <button className="btn btn-primary btn-sm" style={{ marginTop:12 }} onClick={addBonus}>+ Add question</button>
      </div>

      <div className="card" style={{ marginTop:18, borderColor:'rgba(255,77,77,0.3)' }}>
        <div className="card-title" style={{ color:'var(--red)' }}>Danger zone</div>
        <p className="helper" style={{ marginBottom:12 }}>Wipes every pundit's account and picks plus all settings. There's no undo — export a backup first.</p>
        <div style={{ marginBottom:16 }}>
          <p className="helper" style={{ marginBottom:8 }}>Force every device to re-sync and re-login on next open — fixes stale sessions after a wipe. No data is deleted.</p>
          <button className="btn btn-sm" onClick={forceResync}>↻ Force all devices to re-sync</button>
        </div>
        <button className="btn btn-danger btn-sm" onClick={resetAll}>Wipe all league data</button>
      </div>
    </div>
  );
}

// ============================================================
// MOUNT
// ============================================================
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
